<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翰林四上數學 - 數位電子書</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        .page-transition {
            transition: all 0.3s ease-in-out;
        }
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="bg-white text-indigo-700 font-bold px-3 py-1 rounded-lg text-sm shadow">翰林四上</span>
                <h1 class="text-lg md:text-xl font-bold tracking-wide">數學學習教材</h1>
            </div>
            <div class="flex items-center space-x-2 mt-2 sm:mt-0">
                <span id="pageIndicator" class="bg-indigo-700 px-3 py-1 rounded-full text-sm font-medium">第 1 頁 / 共 10 頁</span>
                <button onclick="toggleFullscreen()" class="bg-indigo-500 hover:bg-indigo-400 p-2 rounded-lg text-white transition shadow" title="全螢幕模式">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto p-4 flex flex-col items-center justify-center my-auto">
        <!-- Main Viewer Card -->
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden w-full flex flex-col border border-slate-100 relative group">
            
            <!-- Image Viewport & Canvas Container -->
            <div id="viewportContainer" class="relative w-full bg-slate-900 flex items-center justify-center min-h-[400px] md:min-h-[550px] overflow-hidden select-none">
                <img id="mainImage" src="" alt="教材圖片" class="max-h-[75vh] w-auto object-contain page-transition shadow-2xl pointer-events-none" onerror="this.src='https://placehold.co/800x600/1e293b/ffffff?text=載入圖片中或連結失效';">
                
                <!-- Drawing Canvas overlaid on top of image -->
                <canvas id="drawCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>

                <!-- Loading overlay indicator -->
                <div id="loadingOverlay" class="absolute inset-0 bg-slate-900/40 flex items-center justify-center opacity-0 pointer-events-none transition-opacity z-20">
                    <div class="animate-spin rounded-full h-10 w-10 border-4 border-white border-t-transparent"></div>
                </div>

                <!-- Left Navigation Cluster (<, <<) -->
                <div class="absolute left-3 top-1/2 -translate-y-1/2 flex flex-col items-center gap-2 z-40">
                    <button onclick="prevPage()" class="bg-black/50 hover:bg-black/75 text-white w-12 h-12 rounded-full flex items-center justify-center text-lg transition backdrop-blur-sm shadow-lg focus:outline-none" title="上一頁">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button onclick="firstPage()" class="bg-black/50 hover:bg-black/75 text-white w-10 h-10 rounded-full flex items-center justify-center text-xs transition backdrop-blur-sm shadow-lg focus:outline-none font-bold tracking-tighter" title="第一頁">
                        &lt;&lt;
                    </button>
                </div>

                <!-- Right Navigation Cluster (>, >>, Pen Toggle, Settings Cog) -->
                <!-- Set high z-index (60) so buttons always stay on top of canvas and never get covered by brush strokes -->
                <div class="absolute right-3 top-1/2 -translate-y-1/2 flex flex-col items-center gap-2 z-[60]">
                    <button onclick="nextPage()" class="bg-black/50 hover:bg-black/75 text-white w-12 h-12 rounded-full flex items-center justify-center text-lg transition backdrop-blur-sm shadow-lg focus:outline-none" title="下一頁">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    <button onclick="lastPage()" class="bg-black/50 hover:bg-black/75 text-white w-10 h-10 rounded-full flex items-center justify-center text-xs transition backdrop-blur-sm shadow-lg focus:outline-none font-bold tracking-tighter" title="最後一頁">
                        &gt;&gt;
                    </button>
                    
                    <!-- Main Pen Toggle Button (Starts inactive, 3D neon glow when active) -->
                    <button id="penToggleBtn" onclick="togglePenMode()" class="bg-black/50 hover:bg-black/75 text-slate-300 w-10 h-10 rounded-full flex items-center justify-center text-sm transition backdrop-blur-sm shadow-lg focus:outline-none border border-transparent mt-1" title="畫筆功能開關">
                        <i class="fa-solid fa-pen"></i>
                    </button>

                    <!-- Floating button to reopen settings panel (Placed immediately below pen button) -->
                    <button id="openSettingsBtn" onclick="togglePenSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs shadow-xl transition hidden mt-1" title="開啟畫筆設定">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>

                <!-- Pen Toolbar Popup -->
                <div id="penToolbar" class="absolute bottom-6 right-20 bg-white/95 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-2xl border border-slate-200 flex items-center gap-3 z-[70] hidden transition-all">
                    <!-- Color Picker -->
                    <div class="flex items-center gap-1.5" title="選擇顏色">
                        <input type="color" id="penColor" value="#ef4444" class="w-7 h-7 rounded border border-slate-300 cursor-pointer p-0 bg-transparent">
                    </div>
                    <!-- Type Selector -->
                    <div class="relative">
                        <select id="penType" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                            <option value="highlighter">透明螢光筆 (25%)</option>
                            <option value="solid">實心畫筆</option>
                        </select>
                    </div>
                    <!-- Size Selector -->
                    <div class="relative">
                        <select id="penSize" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                            <option value="3">細</option>
                            <option value="8" selected>中</option>
                            <option value="18">粗</option>
                        </select>
                    </div>
                    <!-- Clear Canvas Button -->
                    <button onclick="clearCanvas()" class="w-8 h-8 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 flex items-center justify-center transition" title="清除畫面">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                    <!-- Collapse Settings Popup Button (Keeps pen active & drawing mode ON, hides panel) -->
                    <button onclick="togglePenSettings()" class="w-8 h-8 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center shadow-md transition" title="收合設定選單（保持畫筆功能）">
                        <i class="fa-solid fa-check text-xs"></i>
                    </button>
                </div>

            </div>

            <!-- Image Caption Bar -->
            <div class="bg-white px-6 py-4 flex flex-col sm:flex-row justify-between items-center border-t border-slate-100 gap-3">
                <div class="text-slate-600 font-medium text-sm md:text-base flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-indigo-600"></i>
                    <span id="imageTitle">單元頁面載入中...</span>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="prevPage()" class="flex-1 sm:flex-none px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-arrow-left"></i> 上一頁
                    </button>
                    <button onclick="nextPage()" class="flex-1 sm:flex-none px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-md shadow-indigo-200">
                        下一頁 <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="w-full mt-6 bg-white p-4 rounded-2xl shadow-md border border-slate-100">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">頁面快速預覽</h3>
            <div id="thumbnailContainer" class="flex gap-3 overflow-x-auto pb-2 scroll-smooth">
                <!-- Thumbnails injected dynamically -->
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 mt-8 text-center text-xs text-slate-500">
        <p>翰林四上數學數位互動教材 &copy; 2026 | 依據雲端資料夾圖片順序建置</p>
    </footer>

    <script>
        const images = [
            { url: "https://lh3.googleusercontent.com/d/1cP3V9QwSV9mDVbwNT9cZPT0a04msS_Q7=s1600", title: "翰林四上數學 - 頁面 01" },
            { url: "https://lh3.googleusercontent.com/d/1_jrUNZpLCYmsMnh2hOsjPTLWnO_pRMRL=s1600", title: "翰林四上數學 - 頁面 02" },
            { url: "https://lh3.googleusercontent.com/d/1N1_xU00bWYXAd3WOSvS1HRbndFp9sqxX=s1600", title: "翰林四上數學 - 頁面 03" },
            { url: "https://lh3.googleusercontent.com/d/1lZmqO35-GJ3LS6nNcqKUSp1_7AXMeRYd=s1600", title: "翰林四上數學 - 頁面 04" },
            { url: "https://lh3.googleusercontent.com/d/1ciCae6Xh3Ljm9Ax3gatDYOG7k7BEh-HB=s1600", title: "翰林四上數學 - 頁面 05" },
            { url: "https://lh3.googleusercontent.com/d/1ZKM6D4UWWxe9-YzetUA6epqCtBixmv5j=s1600", title: "翰林四上數學 - 頁面 06" },
            { url: "https://lh3.googleusercontent.com/d/1LO6y8d3idARPVRLqzeioQrjYQZ2SJGEo=s1600", title: "翰林四上數學 - 頁面 07" },
            { url: "https://lh3.googleusercontent.com/d/1ViZxRdBQIjWJtn8zAXwLw72AINVbdc27=s1600", title: "翰林四上數學 - 頁面 08" },
            { url: "https://lh3.googleusercontent.com/d/13P93Zxa-KLcj79oJbx8CHQLqKUKj7kjd=s1600", title: "翰林四上數學 - 頁面 09" },
            { url: "https://lh3.googleusercontent.com/d/1vtrg_zH1Lm3KnQRFZaXKHKCNFNlysYp0=s1600", title: "翰林四上數學 - 頁面 10" }
        ];

        let currentIndex = 0;
        let isDrawingMode = false;
        let isSettingsOpen = false;
        let isDrawing = false;
        let pageDrawings = {}; 

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        let bufferCanvas = document.createElement('canvas');
        let bufferCtx = bufferCanvas.getContext('2d');
        
        let currentStroke = [];

        window.onload = function() {
            renderThumbnails();
            updateView();
            initCanvasSize();

            window.addEventListener('resize', () => {
                initCanvasSize();
                redrawCanvas();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    prevPage();
                } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    nextPage();
                }
            });

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        };

        function initCanvasSize() {
            const container = document.getElementById('viewportContainer');
            const w = container.clientWidth;
            const h = container.clientHeight;
            
            if (w === 0 || h === 0) return;

            let tempImgData = null;
            if (bufferCanvas.width > 0 && bufferCanvas.height > 0) {
                tempImgData = bufferCtx.getImageData(0, 0, bufferCanvas.width, bufferCanvas.height);
            }

            canvas.width = w;
            canvas.height = h;
            bufferCanvas.width = w;
            bufferCanvas.height = h;

            if (tempImgData) {
                bufferCtx.putImageData(tempImgData, 0, 0);
            }
            redrawCanvas();
        }

        function togglePenMode() {
            isDrawingMode = !isDrawingMode;
            const btn = document.getElementById('penToggleBtn');
            const toolbar = document.getElementById('penToolbar');
            const openSettingsBtn = document.getElementById('openSettingsBtn');

            if (isDrawingMode) {
                // Active 3D state with neon glowing frame & soft shadow
                btn.className = "w-10 h-10 rounded-full flex items-center justify-center text-sm transition backdrop-blur-sm shadow-xl focus:outline-none bg-gradient-to-tr from-indigo-600 to-sky-400 text-white border-2 border-white/90 shadow-[0_0_20px_rgba(99,102,241,0.9)] scale-105 mt-1";
                toolbar.classList.remove('hidden');
                openSettingsBtn.classList.add('hidden');
                isSettingsOpen = true;
                canvas.style.pointerEvents = 'auto';
            } else {
                // Normal inactive state
                btn.className = "bg-black/50 hover:bg-black/75 text-slate-300 w-10 h-10 rounded-full flex items-center justify-center text-sm transition backdrop-blur-sm shadow-lg focus:outline-none border border-transparent mt-1";
                toolbar.classList.add('hidden');
                openSettingsBtn.classList.add('hidden');
                isSettingsOpen = false;
                canvas.style.pointerEvents = 'none';
            }
        }

        function togglePenSettings() {
            if (!isDrawingMode) return;
            isSettingsOpen = !isSettingsOpen;
            const toolbar = document.getElementById('penToolbar');
            const openSettingsBtn = document.getElementById('openSettingsBtn');

            if (isSettingsOpen) {
                toolbar.classList.remove('hidden');
                openSettingsBtn.classList.add('hidden');
            } else {
                toolbar.classList.add('hidden');
                openSettingsBtn.classList.remove('hidden');
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        // Prevent drawing over the right-side buttons cluster area so buttons remain clickable
        function isOverButtonArea(pos) {
            return pos.x > (canvas.width - 70) && (pos.y > (canvas.height / 2 - 160) && pos.y < (canvas.height / 2 + 160));
        }

        function startDrawing(e) {
            if (!isDrawingMode) return;
            const pos = getMousePos(e);
            if (isOverButtonArea(pos)) return;

            isDrawing = true;
            currentStroke = [pos];
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing || !isDrawingMode) return;
            const pos = getMousePos(e);
            if (isOverButtonArea(pos)) return;

            currentStroke.push(pos);

            const color = document.getElementById('penColor').value;
            const type = document.getElementById('penType').value;
            const size = parseInt(document.getElementById('penSize').value);

            bufferCtx.save();
            bufferCtx.lineWidth = size;
            bufferCtx.lineCap = 'round';
            bufferCtx.lineJoin = 'round';

            if (type === 'highlighter') {
                bufferCtx.globalAlpha = 0.25; // Permanent 25% transparency for highlighter
                bufferCtx.strokeStyle = color;
            } else {
                bufferCtx.globalAlpha = 1.0;
                bufferCtx.strokeStyle = color;
            }

            if (currentStroke.length >= 2) {
                const len = currentStroke.length;
                bufferCtx.beginPath();
                bufferCtx.moveTo(currentStroke[len - 2].x, currentStroke[len - 2].y);
                bufferCtx.lineTo(currentStroke[len - 1].x, currentStroke[len - 1].y);
                bufferCtx.stroke();
            }
            bufferCtx.restore();

            redrawCanvas();
            e.preventDefault();
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            currentStroke = [];
            pageDrawings[currentIndex] = bufferCanvas.toDataURL();
        }

        function handleTouchStart(e) {
            if (!isDrawingMode) return;
            startDrawing(e);
        }

        function handleTouchMove(e) {
            if (!isDrawingMode) return;
            draw(e);
        }

        function clearCanvas() {
            bufferCtx.clearRect(0, 0, bufferCanvas.width, bufferCanvas.height);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            delete pageDrawings[currentIndex];
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bufferCanvas, 0, 0);
        }

        function renderThumbnails() {
            const container = document.getElementById('thumbnailContainer');
            container.innerHTML = '';

            images.forEach((img, idx) => {
                const thumbDiv = document.createElement('div');
                thumbDiv.className = `flex-shrink-0 w-24 h-20 rounded-xl overflow-hidden cursor-pointer border-2 transition-all relative ${idx === currentIndex ? 'border-indigo-600 shadow-md scale-105' : 'border-slate-200 opacity-70 hover:opacity-100 hover:border-slate-400'}`;
                thumbDiv.onclick = () => goToPage(idx);

                thumbDiv.innerHTML = `
                    <img src="${img.url}" alt="縮圖 ${idx + 1}" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded">${idx + 1}</div>
                `;
                container.appendChild(thumbDiv);
            });
        }

        function updateView() {
            const mainImg = document.getElementById('mainImage');
            const imgTitle = document.getElementById('imageTitle');
            const pageIndicator = document.getElementById('pageIndicator');
            const loadingOverlay = document.getElementById('loadingOverlay');

            loadingOverlay.classList.remove('opacity-0');
            mainImg.style.opacity = '0.3';

            mainImg.src = images[currentIndex].url;
            imgTitle.textContent = images[currentIndex].title;
            pageIndicator.textContent = `第 ${currentIndex + 1} 頁 / 共 ${images.length} 頁`;

            mainImg.onload = function() {
                mainImg.style.opacity = '1';
                loadingOverlay.classList.add('opacity-0');
                
                bufferCtx.clearRect(0, 0, bufferCanvas.width, bufferCanvas.height);
                if (pageDrawings[currentIndex]) {
                    const img = new Image();
                    img.onload = function() {
                        bufferCtx.drawImage(img, 0, 0);
                        redrawCanvas();
                    };
                    img.src = pageDrawings[currentIndex];
                } else {
                    redrawCanvas();
                }
            };

            const thumbnails = document.getElementById('thumbnailContainer').children;
            for (let i = 0; i < thumbnails.length; i++) {
                if (i === currentIndex) {
                    thumbnails[i].className = "flex-shrink-0 w-24 h-20 rounded-xl overflow-hidden cursor-pointer border-2 border-indigo-600 shadow-md scale-105 transition-all relative";
                    thumbnails[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } else {
                    thumbnails[i].className = "flex-shrink-0 w-24 h-20 rounded-xl overflow-hidden cursor-pointer border-2 border-slate-200 opacity-70 hover:opacity-100 hover:border-slate-400 transition-all relative";
                }
            }
        }

        function nextPage() {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                updateView();
            }
        }

        function prevPage() {
            if (currentIndex > 0) {
                currentIndex--;
                updateView();
            }
        }

        function firstPage() {
            if (currentIndex !== 0) {
                currentIndex = 0;
                updateView();
            }
        }

        function lastPage() {
            if (currentIndex !== images.length - 1) {
                currentIndex = images.length - 1;
                updateView();
            }
        }

        function goToPage(index) {
            if (index >= 0 && index < images.length) {
                currentIndex = index;
                updateView();
            }
        }

        function toggleFullscreen() {
            if (!document.documentElement.requestFullscreen) return;
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
