<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翰林四上數學 - 數位電子書</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        .page-transition {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
            transform-origin: center center;
        }
        ::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .pen-active-glow {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.9), inset 0 0 10px rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center relative">
            <div class="flex items-center space-x-3">
                <button onclick="toggleFloatingMenu()" class="bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-xl font-bold text-sm shadow flex items-center gap-2 transition focus:outline-none border border-indigo-500" title="展開/收起課程目錄">
                    <i class="fa-solid fa-bars" id="menuToggleIcon"></i>
                    <span>課程目錄</span>
                </button>
                <span class="bg-white text-indigo-700 font-bold px-3 py-1 rounded-lg text-sm shadow">翰林四上</span>
                <h1 class="text-lg md:text-xl font-bold tracking-wide hidden sm:inline">數學學習教材</h1>
            </div>
            <div class="flex items-center space-x-2 mt-2 sm:mt-0">
                <span id="pageIndicator" class="bg-indigo-700 px-3 py-1 rounded-full text-sm font-medium">第 1 頁 / 共 198 頁</span>
                <button onclick="toggleFullscreen()" class="bg-indigo-500 hover:bg-indigo-400 p-2 rounded-lg text-white transition shadow" title="全螢幕模式">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>

            <!-- Floating Collapsible Chapter Menu Dropdown -->
            <div id="floatingChapterMenu" class="absolute top-14 left-4 bg-white text-slate-800 w-80 max-h-[70vh] overflow-y-auto rounded-2xl shadow-2xl border border-slate-200 z-50 hidden p-3 transition-all">
                <div class="flex justify-between items-center mb-2 px-2 border-b border-slate-100 pb-2">
                    <span class="font-bold text-sm text-indigo-600 flex items-center gap-1.5">
                        <i class="fa-solid fa-bookmark"></i> 快速章節導覽
                    </span>
                    <button onclick="toggleFloatingMenu()" class="text-slate-400 hover:text-slate-600 p-1 text-xs font-bold">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>
                <div id="chapterListContainer" class="flex flex-col gap-1">
                    <!-- Dynamic chapter items inserted here -->
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-5xl w-full mx-auto p-4 flex flex-col items-center justify-center my-auto">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden w-full flex flex-col border border-slate-100 relative group">
            
            <div id="viewportContainer" class="relative w-full bg-slate-900 flex items-center justify-center min-h-[400px] md:min-h-[550px] overflow-auto select-none">
                <div id="imageWrapper" class="relative flex items-center justify-center w-full py-6 min-h-full">
                    <img id="mainImage" src="" alt="教材圖片" class="max-h-[75vh] w-auto object-contain page-transition shadow-2xl pointer-events-none scale-100" onerror="this.src='https://placehold.co/800x600/1e293b/ffffff?text=載入圖片中或連結失效';">
                    
                    <canvas id="drawCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>
                </div>

                <div id="loadingOverlay" class="absolute inset-0 bg-slate-900/40 flex items-center justify-center opacity-0 pointer-events-none transition-opacity z-25">
                    <div class="animate-spin rounded-full h-10 w-10 border-4 border-white border-t-transparent"></div>
                </div>

                <div class="absolute left-3 top-1/2 -translate-y-1/2 flex flex-col items-center gap-2 z-30">
                    <button onclick="prevPage()" class="bg-black/50 hover:bg-black/75 text-white w-12 h-12 rounded-full flex items-center justify-center text-lg transition backdrop-blur-sm shadow-lg focus:outline-none" title="上一頁">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button onclick="firstPage()" class="bg-black/50 hover:bg-black/75 text-white w-10 h-10 rounded-full flex items-center justify-center text-xs transition backdrop-blur-sm shadow-lg focus:outline-none font-bold tracking-tighter" title="第一頁">
                        &lt;&lt;
                    </button>
                    <button id="zoomToggleBtn" onclick="toggleZoom()" class="bg-black/50 hover:bg-black/75 text-slate-300 w-10 h-10 rounded-full flex items-center justify-center text-sm transition backdrop-blur-sm shadow-lg focus:outline-none border border-transparent mt-1" title="放大/縮小圖片">
                        <i class="fa-solid fa-search-plus" id="zoomIcon"></i>
                    </button>
                </div>

                <div class="absolute right-3 top-1/2 -translate-y-1/2 flex flex-col items-center gap-2 z-30">
                    <button onclick="nextPage()" class="bg-black/50 hover:bg-black/75 text-white w-12 h-12 rounded-full flex items-center justify-center text-lg transition backdrop-blur-sm shadow-lg focus:outline-none" title="下一頁">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    <button onclick="lastPage()" class="bg-black/50 hover:bg-black/75 text-white w-10 h-10 rounded-full flex items-center justify-center text-xs transition backdrop-blur-sm shadow-lg focus:outline-none font-bold tracking-tighter" title="最後一頁">
                        &gt;&gt;
                    </button>
                    
                    <button id="penToggleBtn" onclick="togglePenMode()" class="bg-black/50 hover:bg-black/75 text-slate-300 w-10 h-10 rounded-full flex items-center justify-center text-sm transition backdrop-blur-sm shadow-lg focus:outline-none border border-transparent mt-1" title="畫筆功能開關">
                        <i class="fa-solid fa-pen"></i>
                    </button>

                    <button id="openSettingsBtn" onclick="togglePenSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs shadow-xl transition hidden mt-1" title="開啟畫筆設定">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>

                <!-- Pen Tool Floating Toolbar -->
                <div id="penToolbar" class="absolute bottom-6 right-20 bg-white/95 backdrop-blur-md px-4 py-2.5 rounded-2xl shadow-2xl border border-slate-200 flex items-center gap-3 z-[60] hidden transition-all">
                    <div class="flex items-center gap-1.5" title="選擇顏色">
                        <input type="color" id="penColor" value="#ef4444" class="w-7 h-7 rounded border border-slate-300 cursor-pointer p-0 bg-transparent">
                    </div>
                    <div class="relative">
                        <select id="penType" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                            <option value="highlighter">透明螢光筆 (25%)</option>
                            <option value="solid">實心畫筆</option>
                        </select>
                    </div>
                    <div class="relative">
                        <select id="penSize" class="bg-slate-50 border border-slate-200 text-slate-700 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
                            <option value="3">細</option>
                            <option value="8" selected>中</option>
                            <option value="18">粗</option>
                        </select>
                    </div>
                    <button onclick="clearCanvas()" class="w-8 h-8 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 flex items-center justify-center transition" title="清除畫面">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                    <button onclick="togglePenSettings()" class="w-8 h-8 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center shadow-md transition" title="收合設定選單（保持畫筆功能）">
                        <i class="fa-solid fa-check text-xs"></i>
                    </button>
                </div>

            </div>

            <div class="bg-white px-6 py-4 flex flex-col sm:flex-row justify-between items-center border-t border-slate-100 gap-3">
                <div class="text-slate-600 font-medium text-sm md:text-base flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-indigo-600"></i>
                    <span id="imageTitle">單元頁面載入中...</span>
                </div>
                <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                    <button onclick="prevPage()" class="flex-1 sm:flex-none px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-xl transition flex items-center justify-center gap-2 text-sm">
                        <i class="fa-solid fa-arrow-left"></i> 上一頁
                    </button>
                    <button onclick="nextPage()" class="flex-1 sm:flex-none px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-md shadow-indigo-200">
                        下一頁 <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="w-full mt-6 bg-white p-4 rounded-2xl shadow-md border border-slate-100">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 px-1">頁面快速預覽</h3>
            <div id="thumbnailContainer" class="flex gap-3 overflow-x-auto pb-2 scroll-smooth">
                <!-- Thumbnails injected dynamically -->
            </div>
        </div>
    </main>

        <p>翰林四上數學數位互動教材 &copy; 2026 | 共 198 頁完整單元教材</p>
    </footer>

            { name: "9-3 P163", url: "https://lh3.googleusercontent.com/d/1TmuiBhHwBbKoexsrR3L8JkBmI-ppgIY6=s1600" },
            { name: "9-4 P167", url: "https://lh3.googleusercontent.com/d/1a-l9zHtPnNxHjLlX-GuQfXFm6Vk-GAMp=s1600" },
            { name: "10-1 P173", url: "https://lh3.googleusercontent.com/d/1p5lTl1OxCoydLr8XVLpPSI6UYVsr_L-l=s1600" },
            { name: "10-2 P178", url: "https://lh3.googleusercontent.com/d/1clCZzyhsQjmbvxjWKOe8g2MHIfxkotkd=s1600" },
            { name: "10-3 P183", url: "https://lh3.googleusercontent.com/d/1Id6DzAamV9SVfpO9tsGVbvMMGO4Spd4O=s1600" },
            { name: "番外海報 P194", url: "https://lh3.googleusercontent.com/d/1jJAuISb94pAjQvdD3fDeMsdEA9SZURgw=s1600" }
        ];

        let currentIndex = 0;
        let isDrawingMode = false;
        let isSettingsOpen = false;
        let isMenuOpen = false;
        let zoomState = 0;
        let isDrawing = false;
        let pageDrawings = {}; 

        const canvas = document.getElementById('drawCanvas');
        const ctx = canvas.getContext('2d');

        let bufferCanvas = document.createElement('canvas');
        let bufferCtx = bufferCanvas.getContext('2d');
        
        let currentStroke = [];

        window.onload = function() {
            renderThumbnails();
            renderFloatingMenu();
            updateView();
            initCanvasSize();

            window.addEventListener('resize', () => {
                initCanvasSize();
                redrawCanvas();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                    prevPage();
                } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    nextPage();
                }
            });

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
            canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
            canvas.addEventListener('touchend', stopDrawing);
        };

        function toggleFloatingMenu() {
            isMenuOpen = !isMenuOpen;
            const menu = document.getElementById('floatingChapterMenu');
            if (isMenuOpen) {
                menu.classList.remove('hidden');
            } else {
                menu.classList.add('hidden');
            }
        }

        function renderFloatingMenu() {
            const container = document.getElementById('chapterListContainer');
            container.innerHTML = '';

            chapterList.forEach(item => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-3 py-2 rounded-xl text-xs md:text-sm font-medium text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition flex justify-between items-center";
                btn.innerHTML = `<span>${item.name}</span> <i class="fa-solid fa-chevron-right text-[10px] text-slate-400"></i>`;
                
                btn.onclick = () => {
                    const foundIdx = images.findIndex(img => img.url === item.url);
                    if (foundIdx !== -1) {
                        goToPage(foundIdx);
                    } else {
                        const foundByName = images.findIndex(img => img.title === item.name);
                        if (foundByName !== -1) goToPage(foundByName);
                    }
                    toggleFloatingMenu();
                };
                container.appendChild(btn);
            });
        }

        function initCanvasSize() {
            const mainImg = document.getElementById('mainImage');
            const w = mainImg.clientWidth || document.getElementById('viewportContainer').clientWidth;
            const h = mainImg.clientHeight || document.getElementById('viewportContainer').clientHeight;
            
            if (w === 0 || h === 0) return;

            let tempImgData = null;
            if (bufferCanvas.width > 0 && bufferCanvas.height > 0) {
                tempImgData = bufferCtx.getImageData(0, 0, bufferCanvas.width, bufferCanvas.height);
            }

            canvas.width = w;
            canvas.height = h;
            bufferCanvas.width = w;
            bufferCanvas.height = h;

            if (tempImgData) {
                bufferCtx.putImageData(tempImgData, 0, 0);
            }
            redrawCanvas();
        }

        function toggleZoom() {
            zoomState = (zoomState + 1) % 3;
            const mainImg = document.getElementById('mainImage');
            const btn = document.getElementById('zoomToggleBtn');
            const icon = document.getElementById('zoomIcon');

            if (zoomState === 1) {
                mainImg.className = "max-h-[75vh] w-auto object-contain page-transition shadow-2xl pointer-events-none scale-[1.25]";
                btn.className = "w-10 h-10 rounded-full flex items-center justify-center text-sm transition backdrop-blur-sm shadow-xl focus:outline-none pen-active-glow mt-1";
                icon.className = "fa-solid fa-search-plus";
                btn.title = "放大圖片 (1.5x)";
            } else if (zoomState === 2) {
                mainImg.className = "max-h-[75vh] w-auto object-contain page-transition shadow-2xl pointer-events-none scale-[1.5]";
                btn.className = "w-10 h-10 rounded-full flex items-center justify-center text-sm transition backdrop-blur-sm shadow-xl focus:outline-none pen-active-glow mt-1";
                icon.className = "fa-solid fa-search-plus";
                btn.title = "恢復原尺寸 (1.0x)";
            } else {
                mainImg.className = "max-h-[75vh] w-auto object-contain page-transition shadow-2xl pointer-events-none scale-100";
                btn.className = "bg-black/50 hover:bg-black/75 text-slate-300 w-10 h-10 rounded-full flex items-center justify-center text-sm transition backdrop-blur-sm shadow-lg focus:outline-none border border-transparent mt-1";
                icon.className = "fa-solid fa-search-plus";
                btn.title = "放大圖片 (1.25x)";
            }
            setTimeout(initCanvasSize, 150);
        }

        function togglePenMode() {
            isDrawingMode = !isDrawingMode;
            const btn = document.getElementById('penToggleBtn');
            const toolbar = document.getElementById('penToolbar');
            const openSettingsBtn = document.getElementById('openSettingsBtn');

            if (isDrawingMode) {
                btn.className = "w-10 h-10 rounded-full flex items-center justify-center text-sm transition backdrop-blur-sm shadow-xl focus:outline-none pen-active-glow mt-1";
                toolbar.classList.remove('hidden');
                openSettingsBtn.classList.add('hidden');
                isSettingsOpen = true;
                canvas.style.pointerEvents = 'auto';
            } else {
                btn.className = "bg-black/50 hover:bg-black/75 text-slate-300 w-10 h-10 rounded-full flex items-center justify-center text-sm transition backdrop-blur-sm shadow-lg focus:outline-none border border-transparent mt-1";
                toolbar.classList.add('hidden');
                openSettingsBtn.classList.add('hidden');
                isSettingsOpen = false;
                canvas.style.pointerEvents = 'none';
            }
        }

        function togglePenSettings() {
            if (!isDrawingMode) return;
            isSettingsOpen = !isSettingsOpen;
            const toolbar = document.getElementById('penToolbar');
            const openSettingsBtn = document.getElementById('openSettingsBtn');

            if (isSettingsOpen) {
                toolbar.classList.remove('hidden');
                openSettingsBtn.classList.add('hidden');
            } else {
                toolbar.classList.add('hidden');
                openSettingsBtn.classList.remove('hidden');
            }
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function isOverButtonArea(pos) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            if (pos.x > (canvas.width - (80 * scaleX)) && (pos.y > (canvas.height / 2 - 200) && pos.y < (canvas.height / 2 + 200))) {
                return true;
            }
            if (pos.x < (80 * scaleX) && (pos.y > (canvas.height / 2 - 200) && pos.y < (canvas.height / 2 + 200))) {
                return true;
            }
            return false;
        }

        function startDrawing(e) {
            if (!isDrawingMode) return;
            const pos = getMousePos(e);
            if (isOverButtonArea(pos)) return;

            isDrawing = true;
            currentStroke = [pos];
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing || !isDrawingMode) return;
            const pos = getMousePos(e);
            if (isOverButtonArea(pos)) return;

            currentStroke.push(pos);

            const color = document.getElementById('penColor').value;
            const type = document.getElementById('penType').value;
            const size = parseInt(document.getElementById('penSize').value);

            bufferCtx.save();
            bufferCtx.lineWidth = size;
            bufferCtx.lineCap = 'round';
            bufferCtx.lineJoin = 'round';

            if (type === 'highlighter') {
                bufferCtx.globalAlpha = 0.25;
                bufferCtx.strokeStyle = color;
            } else {
                bufferCtx.globalAlpha = 1.0;
                bufferCtx.strokeStyle = color;
            }

            if (currentStroke.length >= 2) {
                const len = currentStroke.length;
                bufferCtx.beginPath();
                bufferCtx.moveTo(currentStroke[len - 2].x, currentStroke[len - 2].y);
                bufferCtx.lineTo(currentStroke[len - 1].x, currentStroke[len - 1].y);
                bufferCtx.stroke();
            }
            bufferCtx.restore();

            redrawCanvas();
            e.preventDefault();
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            currentStroke = [];
            pageDrawings[currentIndex] = bufferCanvas.toDataURL();
        }

        function handleTouchStart(e) {
            if (!isDrawingMode) return;
            startDrawing(e);
        }

        function handleTouchMove(e) {
            if (!isDrawingMode) return;
            draw(e);
        }

        function clearCanvas() {
            bufferCtx.clearRect(0, 0, bufferCanvas.width, bufferCanvas.height);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            delete pageDrawings[currentIndex];
        }

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bufferCanvas, 0, 0);
        }

        function renderThumbnails() {
            const container = document.getElementById('thumbnailContainer');
            container.innerHTML = '';

            images.forEach((img, idx) => {
                const thumbDiv = document.createElement('div');
                thumbDiv.className = `flex-shrink-0 w-24 h-20 rounded-xl overflow-hidden cursor-pointer border-2 transition-all relative ${idx === currentIndex ? 'border-indigo-600 shadow-md scale-105' : 'border-slate-200 opacity-70 hover:opacity-100 hover:border-slate-400'}`;
                thumbDiv.onclick = () => goToPage(idx);

                thumbDiv.innerHTML = `
                    <img src="${img.url}" alt="縮圖 ${idx + 1}" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 right-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded">${idx + 1}</div>
                `;
                container.appendChild(thumbDiv);
            });
        }

        function updateView() {
            const mainImg = document.getElementById('mainImage');
            const imgTitle = document.getElementById('imageTitle');
            const pageIndicator = document.getElementById('pageIndicator');
            const loadingOverlay = document.getElementById('loadingOverlay');

            loadingOverlay.classList.remove('opacity-0');
            mainImg.style.opacity = '0.3';

            mainImg.src = images[currentIndex].url;
            imgTitle.textContent = images[currentIndex].title;
            pageIndicator.textContent = `第 ${currentIndex + 1} 頁 / 共 ${images.length} 頁`;

            mainImg.onload = function() {
                mainImg.style.opacity = '1';
                loadingOverlay.classList.add('opacity-0');
                initCanvasSize();
                
                bufferCtx.clearRect(0, 0, bufferCanvas.width, bufferCanvas.height);
                if (pageDrawings[currentIndex]) {
                    const img = new Image();
                    img.onload = function() {
                        bufferCtx.drawImage(img, 0, 0);
                        redrawCanvas();
                    };
                    img.src = pageDrawings[currentIndex];
                } else {
                    redrawCanvas();
                }
            };

            const thumbnails = document.getElementById('thumbnailContainer').children;
            for (let i = 0; i < thumbnails.length; i++) {
                if (i === currentIndex) {
                    thumbnails[i].className = "flex-shrink-0 w-24 h-20 rounded-xl overflow-hidden cursor-pointer border-2 border-indigo-600 shadow-md scale-105 transition-all relative";
                    thumbnails[i].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
                } else {
                    thumbnails[i].className = "flex-shrink-0 w-24 h-20 rounded-xl overflow-hidden cursor-pointer border-2 border-slate-200 opacity-70 hover:opacity-100 hover:border-slate-400 transition-all relative";
                }
            }
        }

        function nextPage() {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                updateView();
            }
        }

        function prevPage() {
            if (currentIndex > 0) {
                currentIndex--;
                updateView();
            }
        }

        function firstPage() {
            if (currentIndex !== 0) {
                currentIndex = 0;
                updateView();
            }
        }

        function lastPage() {
            if (currentIndex !== images.length - 1) {
                currentIndex = images.length - 1;
                updateView();
            }
        }

        function goToPage(index) {
            if (index >= 0 && index < images.length) {
                currentIndex = index;
                updateView();
            }
        }

        function toggleFullscreen() {
            if (!document.documentElement.requestFullscreen) return;
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
