            type: 'ebook',
            id: 'ebook-61',
            title: '自然3上電子書第3-4單元',
            description: '康軒三年級上學期自然與生活科技電子書互動網頁（第3-4單元）。點擊下方按鈕將以新分頁開啟電子書。',
            badge: '電子書',
            originalUrl: 'https://digitalmaster.knsh.com.tw/ebooks/BookMain/Viewer_A/index.html?CUR_BOOK_URL=https://digitalmaster.knsh.com.tw/ebooks/%E5%9C%8B%E5%B0%8F/Books/113%E4%B8%8A/04_%E8%87%AA%E7%84%B6_nature/03_3%E5%B9%B4%E7%B4%9A/01_%E7%B6%B2%E9%A0%81%E9%9B%BB%E5%AD%90%E6%9B%B8/K11312Nature_3/Resource/SystemResource/knsh_book/&shortcode=x1q7n9t0n3q3x8w4t5z5l904m28txvlz&uuid=397e20c7-e380-40fc-bb3f-5b74329299e5&openby=knsh',
            directUrl: 'https://digitalmaster.knsh.com.tw/ebooks/BookMain/Viewer_A/index.html?CUR_BOOK_URL=https://digitalmaster.knsh.com.tw/ebooks/%E5%9C%8B%E5%B0%8F/Books/113%E4%B8%8A/04_%E8%87%AA%E7%84%B6_nature/03_3%E5%B9%B4%E7%B4%9A/01_%E7%B6%B2%E9%A0%81%E9%9B%BB%E5%AD%90%E6%9B%B8/K11312Nature_3/Resource/SystemResource/knsh_book/&shortcode=x1q7n9t0n3q3x8w4t5z5l904m28txvlz&uuid=397e20c7-e380-40fc-bb3f-5b74329299e5&openby=knsh',
            thumbUrl: 'https://placehold.co/200x150/065f46/ffffff?text=Ebook+3-4'
        });

        let currentIndex = 0;
        let isDrawing = false;
        let doodleActive = false;
        let doodleDataMap = {};
        let sidebarOpen = false;

        function initApp() {
            document.getElementById('totalCountBadge').textContent = `共收錄 ${items.length} 項學習內容與資源`;
            renderImageList(items);
            renderThumbnailGrid(items);
            setupCanvas();
            loadItem(0);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            sidebarOpen = !sidebarOpen;
            
            if (sidebarOpen) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
                document.getElementById('sidebarToggleText').textContent = '收合目錄';
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
                document.getElementById('sidebarToggleText').textContent = '展開目錄';
            }
        }

        function setupCanvas() {
            const canvas = document.getElementById('doodleCanvas');
            
            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                redrawCanvas();
            }
            window.addEventListener('resize', resizeCanvas);
            setTimeout(resizeCanvas, 100);

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: touch.clientX, clientY: touch.clientY }));
            });
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: touch.clientX, clientY: touch.clientY }));
            });
            canvas.addEventListener('touchend', (e) => {
                e.preventDefault();
                canvas.dispatchEvent(new MouseEvent('mouseup', {}));
            });
        }

        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: evt.clientX - rect.left,
                y: evt.clientY - rect.top
            };
        }

        function startDrawing(e) {
            if (!doodleActive) return;
            isDrawing = true;
            const canvas = document.getElementById('doodleCanvas');
            const ctx = canvas.getContext('2d');
            const pos = getMousePos(canvas, e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing || !doodleActive) return;
            const canvas = document.getElementById('doodleCanvas');
            const ctx = canvas.getContext('2d');
            const pos = getMousePos(canvas, e);
            
            const color = document.getElementById('brushColor').value;
            const mode = document.getElementById('brushMode').value;
            const size = document.getElementById('brushSize').value;

            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (mode === 'highlighter') {
                ctx.globalAlpha = 0.05; // 5% 輕透螢光筆效果
                ctx.strokeStyle = color;
            } else {
                ctx.globalAlpha = 1.0;
                ctx.strokeStyle = color;
            }
            
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.globalAlpha = 1.0; // Reset alpha
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            saveCurrentDoodle();
        }

        function saveCurrentDoodle() {
            const canvas = document.getElementById('doodleCanvas');
            doodleDataMap[currentIndex] = canvas.toDataURL();
        }

        function redrawCanvas() {
            const canvas = document.getElementById('doodleCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (doodleDataMap[currentIndex]) {
                const img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                };
                img.src = doodleDataMap[currentIndex];
            }
        }

        function clearDoodle() {
            const canvas = document.getElementById('doodleCanvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            delete doodleDataMap[currentIndex];
        }

        function toggleDoodleMode() {
            doodleActive = !doodleActive;
            const canvas = document.getElementById('doodleCanvas');
            const toolbar = document.getElementById('doodleToolbar');
            const btn = document.getElementById('doodleBtn');

            if (doodleActive) {
                canvas.classList.remove('pointer-events-none');
                toolbar.classList.remove('hidden');
                btn.className = "bg-emerald-600 text-white w-9 h-9 rounded-lg text-sm font-medium transition flex items-center justify-center ml-1 shadow-sm";
                btn.title = "關閉畫筆";
            } else {
                canvas.classList.add('pointer-events-none');
                toolbar.classList.add('hidden');
                btn.className = "bg-slate-100 hover:bg-slate-200 text-slate-700 w-9 h-9 rounded-lg text-sm font-medium transition flex items-center justify-center ml-1 border border-slate-200";
                btn.title = "畫線塗鴉";
            }
        }

        function renderImageList(data) {
            const container = document.getElementById('imageListContainer');
            container.innerHTML = data.map((item, originalIndex) => {
                return `
                    <div onclick="selectImage(${originalIndex}); toggleSidebar();" id="list-item-${originalIndex}" class="sidebar-item px-3 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition flex items-center justify-between ${originalIndex === currentIndex ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}">
                        <div class="flex items-center space-x-2.5 truncate">
                            <span class="text-xs px-1.5 py-0.5 rounded ${originalIndex === currentIndex ? 'bg-emerald-700 text-white' : 'bg-slate-200 text-slate-700'}">${originalIndex + 1}</span>
                            <span class="truncate">${item.title}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs opacity-60"></i>
                    </div>
                `;
            }).join('');
        }

        function renderThumbnailGrid(data) {
            const grid = document.getElementById('thumbnailGrid');
            grid.innerHTML = data.map((item, originalIndex) => {
                return `
                    <div onclick="selectImage(${originalIndex})" class="thumb-card group relative rounded-lg overflow-hidden border-2 ${originalIndex === currentIndex ? 'border-emerald-600 shadow-md' : 'border-slate-200 hover:border-emerald-400'} cursor-pointer aspect-video bg-slate-100 transition">
                        <img src="${item.thumbUrl}" alt="縮圖" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://placehold.co/200x150/10b981/ffffff?text=Item'">
                        <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-bold">
                            ${originalIndex + 1}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectImage(index) {
            if (index < 0 || index >= items.length) return;
            currentIndex = index;
            loadItem(currentIndex);
            updateActiveUI();
        }

        function loadItem(index) {
            const item = items[index];
            const imgEl = document.getElementById('mainImageView');
            const quizFrame = document.getElementById('quizFrame');
            const ebookCard = document.getElementById('ebookCard');
            const spinner = document.getElementById('loadingSpinner');
            const fallbackNotice = document.getElementById('fallbackNotice');

            document.getElementById('imageTitle').textContent = item.title;
            document.getElementById('imageBadge').textContent = item.badge;
            document.getElementById('imageDescription').textContent = item.description;
            document.getElementById('imageCounter').textContent = `${index + 1} / ${items.length}`;
            document.getElementById('originalLink').href = item.originalUrl;

            // Reset views
            quizFrame.classList.add('hidden');
            imgEl.classList.add('hidden');
            ebookCard.classList.add('hidden');
            spinner.style.display = 'none';
            fallbackNotice.classList.add('hidden');

            if (item.type === 'quiz') {
                quizFrame.classList.remove('hidden');
                quizFrame.src = item.directUrl;
            } else if (item.type === 'ebook') {
                ebookCard.classList.remove('hidden');
                document.getElementById('ebookCardTitle').textContent = item.title;
                document.getElementById('ebookCardDesc').textContent = item.description;
                document.getElementById('ebookOpenBtn').href = item.originalUrl;
            } else {
                imgEl.classList.remove('hidden');
                spinner.style.display = 'flex';
                imgEl.src = item.directUrl;
            }
            setTimeout(redrawCanvas, 200);
        }

        function hideSpinner() {
            document.getElementById('loadingSpinner').style.display = 'none';
        }

        function handleImageError() {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('fallbackNotice').classList.remove('hidden');
        }

        function firstImage() {
            if (currentIndex <= 0) return;
            selectImage(0);
            scrollToActiveItem();
        }

        function lastImage() {
            if (currentIndex >= items.length - 1) return;
            selectImage(items.length - 1);
            scrollToActiveItem();
        }

        function nextImage() {
            if (currentIndex >= items.length - 1) return;
            selectImage(currentIndex + 1);
            scrollToActiveItem();
        }

        function prevImage() {
            if (currentIndex <= 0) return;
            selectImage(currentIndex - 1);
            scrollToActiveItem();
        }

        function updateActiveUI() {
            document.querySelectorAll('#imageListContainer > div').forEach((el, idx) => {
                const originalIndex = idx;
                if (originalIndex === currentIndex) {
                    el.className = "sidebar-item px-3 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition flex items-center justify-between bg-emerald-600 text-white shadow-sm";
                    const spanEl = el.querySelector('span');
                    if(spanEl) spanEl.className = "text-xs px-1.5 py-0.5 rounded bg-emerald-700 text-white";
                } else {
                    el.className = "sidebar-item px-3 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition flex items-center justify-between text-slate-600 hover:bg-slate-100";
                    const spanEl = el.querySelector('span');
                    if(spanEl) spanEl.className = "text-xs px-1.5 py-0.5 rounded bg-slate-200 text-slate-700";
                }
            });
            renderThumbnailGrid(items);
        }

        function scrollToActiveItem() {
            const activeItem = document.getElementById(`list-item-${currentIndex}`);
            if (activeItem) {
                activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function filterImages() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('imageListContainer');
            
            const matchedItems = items.filter((item, idx) => 
                item.title.toLowerCase().includes(query) || 
                item.description.toLowerCase().includes(query) || 
                (idx + 1).toString().includes(query)
            );

            container.innerHTML = matchedItems.map((item) => {
                const originalIndex = items.indexOf(item);
                return `
                    <div onclick="selectImage(${originalIndex}); toggleSidebar();" id="list-item-${originalIndex}" class="sidebar-item px-3 py-2.5 rounded-xl text-sm font-medium cursor-pointer transition flex items-center justify-between ${originalIndex === currentIndex ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100'}">
                        <div class="flex items-center space-x-2.5 truncate">
                            <span class="text-xs px-1.5 py-0.5 rounded ${originalIndex === currentIndex ? 'bg-emerald-700 text-white' : 'bg-slate-200 text-slate-700'}">${originalIndex + 1}</span>
                            <span class="truncate">${item.title}</span>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs opacity-60"></i>
                    </div>
                `;
            }).join('');
        }

        window.onload = initApp;
    </script>
</body>
</html>
