            "https://lh3.googleusercontent.com/d/1oyzdE5oHZgz07uJhe0oqSKEQpFMHFnA4",
            "https://lh3.googleusercontent.com/d/1GazG1yA4BT454TlKbeY4R5kMwtwC4Ek6",
            "https://lh3.googleusercontent.com/d/1zNG1cqInu11QV89thSwvacEVnS6cDNuE",
            "https://lh3.googleusercontent.com/d/1Cp4r7SNmENxHus_Qfx6xwbZYV05qSkC3",
            "https://lh3.googleusercontent.com/d/1tzHu80NXRRqyVZC6Y6km5uXloxoinfOD"
            // 第 64 頁：健體測驗
            // 第 65 頁：健體影音
            // 第 66 頁：健體影音電子書
        ];

        let currentIndex = 0;
        const totalPages = 66;
        const pageDrawings = {};

        const pageImage = document.getElementById('page-image');
        const quizPage = document.getElementById('quiz-page');
        const videoPage = document.getElementById('video-page');
        const ebookPage = document.getElementById('ebook-page');
        const currentPageNum = document.getElementById('current-page-num');
        const totalPageNum = document.getElementById('total-page-num');
        const jumpInput = document.getElementById('jump-input');
        const loadingIndicator = document.getElementById('loading-indicator');
        
        const prevBtn = document.getElementById('prev-page-btn');
        const nextBtn = document.getElementById('next-page-btn');
        const firstBtn = document.getElementById('first-page-btn');
        const lastBtn = document.getElementById('last-page-btn');

        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebarClose = document.getElementById('sidebar-close');
        const sidebarBackdrop = document.getElementById('sidebar-backdrop');
        const thumbnailContainer = document.getElementById('thumbnail-container');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d');
        const drawToggleBtn = document.getElementById('draw-toggle-btn');
        const clearDrawBtn = document.getElementById('clear-draw-btn');
        const drawToolbar = document.getElementById('draw-toolbar');
        const closeDrawToolbar = document.getElementById('close-draw-toolbar');
        const brushSizeInput = document.getElementById('brush-size');
        const brushSizeVal = document.getElementById('brush-size-val');
        const colorBtns = document.querySelectorAll('.color-btn');
        const customColorPicker = document.getElementById('custom-color-picker');
        const modePenBtn = document.getElementById('mode-pen');
        const modeHighlighterBtn = document.getElementById('mode-highlighter');

        let isDrawingMode = false;
        let isDrawing = false;
        let brushColor = '#ef4444';
        let brushSize = 4;
        let isHighlighter = false;

        let offscreenCanvas = document.createElement('canvas');
        let offCtx = offscreenCanvas.getContext('2d');
        let lastX = 0, lastY = 0;

        totalPageNum.textContent = totalPages;
        jumpInput.max = totalPages;

        function saveCurrentCanvas() {
            if (currentIndex < imageUrls.length && pageImage.naturalWidth) {
                pageDrawings[currentIndex] = canvas.toDataURL();
            }
        }

        function restoreCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (pageDrawings[currentIndex]) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = pageDrawings[currentIndex];
            }
        }

        function resizeCanvasToImage() {
            const rect = pageImage.getBoundingClientRect();
            canvas.width = pageImage.naturalWidth || rect.width || 800;
            canvas.height = pageImage.naturalHeight || rect.height || 600;
            offscreenCanvas.width = canvas.width;
            offscreenCanvas.height = canvas.height;
            restoreCanvas();
        }

        function loadPage(index) {
            saveCurrentCanvas();

            if (index < 0) index = 0;
            if (index >= totalPages) index = totalPages - 1;
            
            currentIndex = index;
            currentPageNum.textContent = currentIndex + 1;
            jumpInput.value = currentIndex + 1;

            // 隱藏所有檢視層
            pageImage.style.display = 'none';
            quizPage.style.display = 'none';
            videoPage.style.display = 'none';
            ebookPage.style.display = 'none';
            canvas.style.display = 'none';

            if (currentIndex === imageUrls.length) {
                // 第 64 頁：健體測驗
                quizPage.style.display = 'flex';
                loadingIndicator.style.display = 'none';
            } else if (currentIndex === imageUrls.length + 1) {
                // 第 65 頁：健體影音
                videoPage.style.display = 'flex';
                loadingIndicator.style.display = 'none';
            } else if (currentIndex === imageUrls.length + 2) {
                // 第 66 頁：健體影音電子書
                ebookPage.style.display = 'flex';
                loadingIndicator.style.display = 'none';
            } else {
                // 一般教材頁面 (1~63 頁)
                pageImage.style.display = 'block';
                canvas.style.display = 'block';
                loadingIndicator.style.display = 'flex';
                pageImage.style.opacity = '0.3';
                pageImage.src = imageUrls[currentIndex];
            }

            document.querySelectorAll('.thumbnail-item').forEach((item, idx) => {
                if (idx === currentIndex) {
                    item.classList.add('border-emerald-500', 'bg-slate-800');
                    item.classList.remove('border-slate-800');
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                } else {
                    item.classList.remove('border-emerald-500', 'bg-slate-800');
                    item.classList.add('border-slate-800');
                }
            });

            updateButtonStates();
        }

        pageImage.onload = () => {
            loadingIndicator.style.display = 'none';
            pageImage.style.opacity = '1';
            resizeCanvasToImage();
        };

        window.addEventListener('resize', () => {
            if (currentIndex < imageUrls.length) {
                resizeCanvasToImage();
            }
        });

        function updateButtonStates() {
            prevBtn.disabled = currentIndex === 0;
            prevBtn.style.opacity = currentIndex === 0 ? '0.4' : '1';
            firstBtn.disabled = currentIndex === 0;
            firstBtn.style.opacity = currentIndex === 0 ? '0.4' : '1';

            nextBtn.disabled = currentIndex === totalPages - 1;
            nextBtn.style.opacity = currentIndex === totalPages - 1 ? '0.4' : '1';
            lastBtn.disabled = currentIndex === totalPages - 1;
            lastBtn.style.opacity = currentIndex === totalPages - 1 ? '0.4' : '1';
        }

        function nextPage() {
            if (currentIndex < totalPages - 1) loadPage(currentIndex + 1);
        }

        function prevPage() {
            if (currentIndex > 0) loadPage(currentIndex - 1);
        }

        prevBtn.addEventListener('click', prevPage);
        nextBtn.addEventListener('click', nextPage);
        firstBtn.addEventListener('click', () => loadPage(0));
        lastBtn.addEventListener('click', () => loadPage(totalPages - 1));

        jumpInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value) - 1;
            if (!isNaN(val)) {
                loadPage(val);
            } else {
                jumpInput.value = currentIndex + 1;
            }
        });

        // 支援鍵盤左右方向鍵翻頁
        document.addEventListener('keydown', (e) => {
            if (document.activeElement === jumpInput) return;
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === 'ArrowDown') {
                nextPage();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'ArrowUp') {
                prevPage();
            }
        });

        drawToggleBtn.addEventListener('click', () => {
            if (currentIndex >= imageUrls.length) return; // 特殊頁面不支援畫筆
            isDrawingMode = !isDrawingMode;
            if (isDrawingMode) {
                drawToggleBtn.classList.add('bg-emerald-600', 'text-white');
                drawToggleBtn.classList.remove('bg-slate-800', 'text-slate-300');
                canvas.style.pointerEvents = 'auto';
                drawToolbar.classList.remove('hidden');
                drawToolbar.classList.add('flex');
            } else {
                exitDrawingMode();
            }
        });

        function exitDrawingMode() {
            isDrawingMode = false;
            drawToggleBtn.classList.remove('bg-emerald-600', 'text-white');
            drawToggleBtn.classList.add('bg-slate-800', 'text-slate-300');
            canvas.style.pointerEvents = 'none';
            drawToolbar.classList.add('hidden');
            drawToolbar.classList.remove('flex');
        }

        closeDrawToolbar.addEventListener('click', exitDrawingMode);

        clearDrawBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            delete pageDrawings[currentIndex];
        });

        modePenBtn.addEventListener('click', () => {
            isHighlighter = false;
            modePenBtn.className = "flex-1 py-1 text-xs rounded bg-emerald-600 text-white transition flex items-center justify-center";
            modeHighlighterBtn.className = "flex-1 py-1 text-xs rounded text-slate-400 hover:text-white transition flex items-center justify-center";
        });

        modeHighlighterBtn.addEventListener('click', () => {
            isHighlighter = true;
            modeHighlighterBtn.className = "flex-1 py-1 text-xs rounded bg-yellow-500 text-slate-950 font-bold transition flex items-center justify-center";
            modePenBtn.className = "flex-1 py-1 text-xs rounded text-slate-400 hover:text-white transition flex items-center justify-center";
        });

        colorBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                colorBtns.forEach(b => b.classList.remove('ring-2', 'ring-white/50'));
                e.target.classList.add('ring-2', 'ring-white/50');
                brushColor = e.target.getAttribute('data-color');
            });
        });

        customColorPicker.addEventListener('input', (e) => {
            brushColor = e.target.value;
            colorBtns.forEach(b => b.classList.remove('ring-2', 'ring-white/50'));
        });

        brushSizeInput.addEventListener('input', (e) => {
            brushSize = e.target.value;
            brushSizeVal.textContent = brushSize + 'px';
        });

        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (evt.clientX - rect.left) * scaleX,
                y: (evt.clientY - rect.top) * scaleY
            };
        }

        function getTouchPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            return {
                x: (evt.touches[0].clientX - rect.left) * scaleX,
                y: (evt.touches[0].clientY - rect.top) * scaleY
            };
        }

        function startDrawing(pos) {
            isDrawing = true;
            lastX = pos.x;
            lastY = pos.y;

            if (isHighlighter) {
                offCtx.clearRect(0, 0, offscreenCanvas.width, offscreenCanvas.height);
                offCtx.save();
                offCtx.strokeStyle = brushColor;
                offCtx.lineWidth = Math.max(brushSize, 14);
                offCtx.lineCap = 'butt';
                offCtx.lineJoin = 'miter';
                offCtx.beginPath();
                offCtx.moveTo(lastX, lastY);
            } else {
                ctx.save();
                ctx.strokeStyle = brushColor;
                ctx.lineWidth = brushSize;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.globalAlpha = 1.0;
                ctx.globalCompositeOperation = 'source-over';
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
            }
        }

        function drawMove(pos) {
            if (!isDrawing) return;

            if (isHighlighter) {
                offCtx.lineTo(pos.x, pos.y);
                offCtx.stroke();
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                if (pageDrawings[currentIndex]) {
                    const img = new Image();
                    img.src = pageDrawings[currentIndex];
                    ctx.drawImage(img, 0, 0);
                }
                ctx.save();
                ctx.globalAlpha = 0.20; // 固定的 20% 螢光濃度
                ctx.globalCompositeOperation = 'multiply';
                ctx.drawImage(offscreenCanvas, 0, 0);
                ctx.restore();
            } else {
                ctx.lineTo(pos.x, pos.y);
                ctx.stroke();
            }
            lastX = pos.x;
            lastY = pos.y;
        }

        function endDrawing() {
            if (!isDrawing) return;
            isDrawing = false;

            if (isHighlighter) {
                offCtx.restore();
                ctx.save();
                ctx.globalAlpha = 0.20;
                ctx.globalCompositeOperation = 'multiply';
                ctx.drawImage(offscreenCanvas, 0, 0);
                ctx.restore();
            } else {
                ctx.restore();
            }
            saveCurrentCanvas();
        }

        canvas.addEventListener('mousedown', (e) => {
            if (!isDrawingMode) return;
            startDrawing(getMousePos(e));
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !isDrawingMode) return;
            drawMove(getMousePos(e));
        });

        window.addEventListener('mouseup', () => {
            endDrawing();
        });

        canvas.addEventListener('touchstart', (e) => {
            if (!isDrawingMode) return;
            startDrawing(getTouchPos(e));
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDrawing || !isDrawingMode) return;
            drawMove(getTouchPos(e));
            e.preventDefault();
        });

        canvas.addEventListener('touchend', () => {
            endDrawing();
        });

        function buildThumbnails() {
            thumbnailContainer.innerHTML = '';
            
            // 1~63 頁縮圖
            imageUrls.forEach((url, idx) => {
                const thumbDiv = document.createElement('div');
                thumbDiv.className = `thumbnail-item flex items-center space-x-3 p-2 rounded-xl border border-slate-800 bg-slate-900/50 hover:bg-slate-800 cursor-pointer transition`;
                thumbDiv.innerHTML = `
                    <div class="w-12 h-16 bg-slate-800 rounded overflow-hidden flex-shrink-0 flex items-center justify-center">
                        <img src="${url}" class="max-w-full max-h-full object-cover" loading="lazy" crossorigin="anonymous">
                    </div>
                    <div class="flex-1">
                        <div class="text-xs font-semibold text-slate-300">第 ${idx + 1} 頁</div>
                        <div class="text-[10px] text-slate-500">康軒三上健體</div>
                    </div>
                `;
                thumbDiv.addEventListener('click', () => {
                    loadPage(idx);
                    toggleSidebar(false);
                });
                thumbnailContainer.appendChild(thumbDiv);
            });

            // 第 64 頁：健體測驗縮圖
            const quizThumbDiv = document.createElement('div');
            quizThumbDiv.className = `thumbnail-item flex items-center space-x-3 p-2 rounded-xl border border-slate-800 bg-slate-900/50 hover:bg-slate-800 cursor-pointer transition`;
            quizThumbDiv.innerHTML = `
                <div class="w-12 h-16 bg-emerald-900/50 border border-emerald-500/30 rounded overflow-hidden flex-shrink-0 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-clipboard-question text-xl"></i>
                </div>
                <div class="flex-1">
                    <div class="text-xs font-semibold text-emerald-400">第 64 頁</div>
                    <div class="text-[10px] text-slate-400">健體測驗專區</div>
                </div>
            `;
            quizThumbDiv.addEventListener('click', () => {
                loadPage(63);
                toggleSidebar(false);
            });
            thumbnailContainer.appendChild(quizThumbDiv);

            // 第 65 頁：健體影音縮圖
            const videoThumbDiv = document.createElement('div');
            videoThumbDiv.className = `thumbnail-item flex items-center space-x-3 p-2 rounded-xl border border-slate-800 bg-slate-900/50 hover:bg-slate-800 cursor-pointer transition`;
            videoThumbDiv.innerHTML = `
                <div class="w-12 h-16 bg-cyan-900/50 border border-cyan-500/30 rounded overflow-hidden flex-shrink-0 flex items-center justify-center text-cyan-400">
                    <i class="fa-solid fa-video text-xl"></i>
                </div>
                <div class="flex-1">
                    <div class="text-xs font-semibold text-cyan-400">第 65 頁</div>
                    <div class="text-[10px] text-slate-400">健體影音專區</div>
                </div>
            `;
            videoThumbDiv.addEventListener('click', () => {
                loadPage(64);
                toggleSidebar(false);
            });
            thumbnailContainer.appendChild(videoThumbDiv);

            // 第 66 頁：健體影音電子書縮圖
            const ebookThumbDiv = document.createElement('div');
            ebookThumbDiv.className = `thumbnail-item flex items-center space-x-3 p-2 rounded-xl border border-slate-800 bg-slate-900/50 hover:bg-slate-800 cursor-pointer transition`;
            ebookThumbDiv.innerHTML = `
                <div class="w-12 h-16 bg-indigo-900/50 border border-indigo-500/30 rounded overflow-hidden flex-shrink-0 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-book-bookmark text-xl"></i>
                </div>
                <div class="flex-1">
                    <div class="text-xs font-semibold text-indigo-400">第 66 頁</div>
                    <div class="text-[10px] text-slate-400">健體影音電子書</div>
                </div>
            `;
            ebookThumbDiv.addEventListener('click', () => {
                loadPage(65);
                toggleSidebar(false);
            });
            thumbnailContainer.appendChild(ebookThumbDiv);
        }

        function toggleSidebar(show) {
            if (show) {
                sidebar.classList.remove('-translate-x-full');
                sidebarBackdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                sidebarBackdrop.classList.add('hidden');
            }
        }

        sidebarToggle.addEventListener('click', () => toggleSidebar(sidebar.classList.contains('-translate-x-full')));
        sidebarClose.addEventListener('click', () => toggleSidebar(false));
        sidebarBackdrop.addEventListener('click', () => toggleSidebar(false));

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error("Error attempting to enable fullscreen:", err.message);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        window.onload = () => {
            buildThumbnails();
            loadPage(0);
        };
    </script>
</body>
</html>
