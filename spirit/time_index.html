    :root { color-scheme: light; }

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: #bae6fd; border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
    ::-webkit-scrollbar-thumb:hover { background: #7dd3fc; background-clip: content-box; }
    ::-webkit-scrollbar-track { background: transparent; }

    @keyframes ec-float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(0, -26px) scale(1.07); }
    }
    .ec-float { animation: ec-float 14s ease-in-out infinite; }
    .ec-float-slow { animation: ec-float 22s ease-in-out infinite; }

    /* 投影倒數外框：桌機／大螢幕＝滿版寬的扁長方框（寬度優先，省下的高度留給小叮嚀）。

    .ec-count-box {
      width: 100%;
      max-width: 1180px;
      aspect-ratio: 1000 / 260;
      max-height: 32vh;
    }
    @media (max-width: 767px) {
      .ec-count-box {
        width: 66vw;
        max-height: 42vh;
        aspect-ratio: 1000 / 440;
      }
    }

    /* 手機：老師小叮嚀卡片在剩下的空間置中；內容太長時 auto margin 會自動歸零，
       改回由頂端排列，不會像 justify-center 那樣把上面幾行裁掉。 */
    @media (max-width: 767px) {
      .ec-announce-card { margin-top: auto; margin-bottom: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      .ec-float, .ec-float-slow { animation: none; }
    }
  </style>

<script type="text/babel" data-presets="env,jsx-classic">

/* ===================== 00-core-namespace.js ===================== */
/**
 * ExamClock — 命名空間與版本
 * ------------------------------------------------------------------
 * 這是一套原創實作，採「核心引擎 / 圖示 / 介面元件 / 檢視畫面」四層分工。
 * 所有子模組掛載於 window.ExamClock，彼此只透過公開介面互動。
 */
(function () {
  'use strict';
  var root = (window.ExamClock = window.ExamClock || {});
  root.APP = 'ExamClock';
  root.VERSION = '2.0.0';
})();


/* ===================== 01-core-config.js ===================== */
/**
 * 核心：組態（Config）
 * ------------------------------------------------------------------
 * 一處集中管理：儲存金鑰、預設狀態、場次預設組、音色清單、限制值。
 * 調整預設值或新增音色，只需要改這個檔。
 */
(function () {
  'use strict';
  var EC = window.ExamClock;

  EC.Config = {
    SCHEMA_VERSION: 2,
    STORE_KEY: 'examclock.v2',

    // 場次快速套用範本（分鐘制）
    presets: [
      { key: 'p40', label: '標準 40 分鐘 ×3', build: function () { return buildRun('08:30', 40, [10, 20], 3); } },
      { key: 'p50', label: '大考 50 分鐘 ×2', build: function () { return buildRun('09:00', 50, 15, 2); } },
      { key: 'p30', label: '短測 30 分鐘 ×3', build: function () { return buildRun('13:20', 30, 10, 3); } }
    ],

    tones: [
      { key: 'chime', label: '鐘聲（四音）' },
      { key: 'pulse', label: '脈衝（兩短）' },
      { key: 'rise', label: '遞升（三音）' }
    ],

    // 背景色彩：8 組多巴胺漸層 + 1 組原色 + 1 組自訂（共 10 組，順序即色票順序）
    // 每組三個色停點（135 度線性漸層）；「自訂」的顏色存在 settings.bgCustom。
    backgrounds: [
      { key: 'peach',  label: '蜜桃夕陽', colors: ['#ff9a8b', '#ff6a88', '#ff99ac'] },
      { key: 'candy',  label: '糖果粉紅', colors: ['#ff9a9e', '#fecfef', '#fbc2eb'] },
      { key: 'lemon',  label: '檸檬派對', colors: ['#f6d365', '#fda085', '#f9d423'] },
      { key: 'mint',   label: '薄荷微風', colors: ['#43e97b', '#38f9d7', '#a8e6cf'] },
      { key: 'ocean',  label: '海洋之心', colors: ['#4facfe', '#00f2fe', '#3b82f6'] },
      { key: 'grape',  label: '葡萄蘇打', colors: ['#a18cd1', '#fbc2eb', '#8e2de2'] },
      { key: 'mango',  label: '熱帶芒果', colors: ['#fad961', '#f76b1c', '#ff6b6b'] },
      { key: 'berry',  label: '莓果優格', colors: ['#f093fb', '#f5576c', '#f093fb'] },
      { key: 'origin', label: '原色', colors: ['#eef4ff', '#fef3e2', '#e8fbf2'] },
      { key: 'custom', label: '自訂', colors: ['#8b5cf6', '#ec4899', '#f59e0b'] }
    ],

    /** 是否為 #rrggbb 色碼 */
    isHexColor: function (c) {
      return typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c);
    },

    /** 正規化三個色停點（壞值用 fallback 補上） */
    normalizeColors: function (list, fallback) {
      var fb = fallback || ['#8b5cf6', '#ec4899', '#f59e0b'];
      var out = [];
      for (var i = 0; i < 3; i++) {
        var c = list && list[i];
        out.push(EC.Config.isHexColor(c) ? c.toLowerCase() : fb[i]);
      }
      return out;
    },

    /**
     * 取得背景設定（找不到時回退第一組）。
     * key 為 'custom' 且有自訂色時，回傳使用者的自訂漸層。
     */
    background: function (key, customColors) {
      var list = EC.Config.backgrounds;
      for (var i = 0; i < list.length; i++) {
        if (list[i].key === key) {
          if (key === 'custom' && customColors) {
            return {
              key: 'custom',
              label: list[i].label,
              colors: EC.Config.normalizeColors(customColors, list[i].colors)
            };
          }
          return list[i];
        }
      }
      return list[0];
    },

    limits: {
      minWarnMinutes: 0,
      maxWarnMinutes: 30,
      minAdvanceSec: 0,
      maxAdvanceSec: 120,
      // 小叮嚀（提醒）字級：50% ~ 700%（1 = 100%）
      minFontScale: 0.5,
      maxFontScale: 7,
      fontStep: 0.5,
      // 設定備份插槽：固定 5 組（名稱長度上限）
      slotCount: 5,
      slotNameMax: 20
    },

    // 全新安裝時的預設資料
    initial: {
      version: 2,
      sessions: [
        { id: 's1', title: '第一節', start: '08:30', end: '09:10', tint: 'indigo' },
        { id: 's2', title: '第二節', start: '09:20', end: '10:00', tint: 'teal' },
        { id: 's3', title: '第三節', start: '10:20', end: '11:00', tint: 'amber' }
      ],
      activeSessionId: 's1',
      attendance: { expected: '', present: '', excused: '', excusedSeats: '' },
      announcements: [
        { id: 'a1', text: '寫完別急著交卷，從頭再檢查一遍', enabled: true, pinned: false }
      ],
      notes: [],
      settings: {
        tone: 'chime',
        volume: 0.8,
        bellAtStart: false,
        bellAtEnd: true,
        warnMinutes: 5,
        advanceDelaySec: 12,
        autoAdvanceNext: true,
        autoStage: true,
        clock24: true,
        fontScale: 1,
        // 設定備份插槽（5 組，載入時會自動補齊；結構：{ name, savedAt, data }）
        slots: [],
        bgSkin: 'peach',
        // 「自訂」背景的三個色停點（#rrggbb）
        bgCustom: ['#8b5cf6', '#ec4899', '#f59e0b']
      }
    }
  };

  /**
   * 依「開始時間＋每節長度＋下課長度」生出連續場次。
   * gap 可傳單一數字（每節下課都一樣），或陣列（依序套用、用完沿用最後一個），
   * 例如 [10, 20] = 第一次下課 10 分、之後 20 分。
   */
  function buildRun(startAt, minutes, gap, count) {
    var out = [];
    var cursor = toMinutes(startAt);
    var tints = ['indigo', 'teal', 'amber', 'rose', 'violet', 'cyan'];
    var names = ['第一節', '第二節', '第三節', '第四節', '第五節', '第六節'];
    for (var i = 0; i < count; i++) {
      var s = cursor;
      var e = cursor + minutes;
      out.push({
        id: 'pre' + Date.now().toString(36) + i,
        title: names[i] || '第' + (i + 1) + '節',
        start: toClock(s),
        end: toClock(e),
        tint: tints[i % tints.length]
      });
      cursor = e + gapAfter(gap, i);
    }
    return out;
  }

  /** 取得第 i 次下課長度：gap 可為數字，或陣列（用完沿用最後一個） */
  function gapAfter(gap, i) {
    if (!gap || !gap.length) return gap || 0;
    var v = gap[i];
    return v == null ? gap[gap.length - 1] : v;
  }

  function toMinutes(hhmm) {
    var p = hhmm.split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  function toClock(mins) {
    mins = ((mins % 1440) + 1440) % 1440;
    var h = Math.floor(mins / 60);
    var m = mins % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
})();


/* ===================== 02-core-storage.js ===================== */
/**
 * 核心：儲存層（Storage）
 * ------------------------------------------------------------------
 * 單一 JSON 文件存於 localStorage，含結構版本與簡易修補（migration）。
 * 讀取失敗一律回退到安全預設值，不讓壞資料拖垮程式。
 */
(function () {
  'use strict';
  var EC = window.ExamClock;

  function readRaw() {
    var raw = null;
    try { raw = localStorage.getItem(EC.Config.STORE_KEY); } catch (e) { return null; }
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function writeRaw(obj) {
    try { localStorage.setItem(EC.Config.STORE_KEY, JSON.stringify(obj)); } catch (e) { /* 空間不足或私密模式 */ }
  }

  /** 深拷貝（僅處理本專案用到的純資料結構） */
  function clone(v) {
    return JSON.parse(JSON.stringify(v));
  }

  /**
   * 設定備份插槽：固定 5 組，缺的補齊、壞的修掉。
   * 每組＝{ name:代表名稱, savedAt:儲存時間, data:完整資料快照 }
   */
  function normalizeSlots(raw) {
    var n = EC.Config.limits.slotCount || 5;
    var max = EC.Config.limits.slotNameMax || 20;
    var list = Array.isArray(raw) ? raw : [];
    var out = [];
    for (var i = 0; i < n; i++) {
      var s = (list[i] && typeof list[i] === 'object') ? list[i] : {};
      out.push({
        name: typeof s.name === 'string' ? s.name.slice(0, max) : '',
        savedAt: typeof s.savedAt === 'string' ? s.savedAt : null,
        data: (s.data && typeof s.data === 'object') ? s.data : null
      });
    }
    return out;
  }

  /**
   * 把任意（可能不完整／壞掉的）資料整理成完整可用的狀態。
   * 匯入備份檔、從備份插槽還原、回復預設值都走這支，壞資料不會拖垮畫面。
   * keepSlots＝要保留的插槽陣列（還原／重設時不要把其他備份一起蓋掉）。
   */
  function buildState(raw, keepSlots) {
    var base = clone(EC.Config.initial);
    var src = (raw && typeof raw === 'object') ? raw : {};
    var state = {
      version: EC.Config.SCHEMA_VERSION,
      sessions: Array.isArray(src.sessions) ? src.sessions.map(normalizeSession) : base.sessions,
      activeSessionId: src.activeSessionId || (base.sessions[0] && base.sessions[0].id) || null,
      attendance: Object.assign({}, base.attendance, src.attendance || {}),
      announcements: Array.isArray(src.announcements) ? src.announcements.map(normalizeAnnouncement) : base.announcements,
      notes: Array.isArray(src.notes) ? src.notes : base.notes,
      settings: normalizeSettings(Object.assign({}, base.settings, src.settings || {}))
    };

    if (state.sessions.length === 0) state.activeSessionId = null;
    else if (!state.sessions.some(function (s) { return s.id === state.activeSessionId; })) {
      state.activeSessionId = state.sessions[0].id;
    }
    if (Array.isArray(keepSlots)) state.settings.slots = normalizeSlots(keepSlots);
    return state;
  }

  /**
   * 取出可備份的內容（＝目前的資料快照，不含 5 組插槽自己）。
   * 匯出檔案與「存到備份插槽」共用同一份格式。
   */
  function snapshot(state) {
    var settings = Object.assign({}, state.settings);
    delete settings.slots;
    return {
      app: 'ExamClock',
      version: EC.VERSION,
      exportedAt: new Date().toISOString(),
      sessions: clone(state.sessions),
      activeSessionId: state.activeSessionId,
      attendance: clone(state.attendance),
      announcements: clone(state.announcements),
      notes: clone(state.notes),
      settings: settings
    };
  }


  /** 讀取並正規化整份狀態 */
  function load() {
    var saved = readRaw();
    if (!saved || typeof saved !== 'object') return buildState(EC.Config.initial, []);
    return buildState(saved);
  }

  function normalizeSession(s) {
    return {
      id: s.id || ('s' + Math.random().toString(36).slice(2, 9)),
      title: s.title || '未命名場次',
      start: s.start || '08:00',
      end: s.end || '08:40',
      tint: s.tint || 'indigo'
    };
  }

  function normalizeAnnouncement(a) {
    return {
      id: a.id || ('a' + Math.random().toString(36).slice(2, 9)),
      text: a.text || '',
      enabled: a.enabled !== false,
      pinned: !!a.pinned
    };
  }

  /** 設定值一律夾在合法範圍，避免匯入壞資料造成畫面爆掉 */
  function normalizeSettings(s) {
    var lim = EC.Config.limits;

    var fs = parseFloat(s.fontScale);
    if (!isFinite(fs)) fs = 1;
    s.fontScale = Math.min(lim.maxFontScale, Math.max(lim.minFontScale, fs));

    var vol = parseFloat(s.volume);
    if (!isFinite(vol)) vol = 0.8;
    s.volume = Math.min(1, Math.max(0, vol));

    var known = EC.Config.backgrounds.some(function (b) { return b.key === s.bgSkin; });
    if (!known) s.bgSkin = EC.Config.backgrounds[0].key;

    // 自訂背景三色（壞資料一律回退成預設，不讓畫面爆掉）
    s.bgCustom = EC.Config.normalizeColors(s.bgCustom);

    // 設定備份插槽：固定 5 組
    s.slots = normalizeSlots(s.slots);

    return s;
  }

  function save(state) {
    writeRaw(state);
  }

  function clear() {
    try { localStorage.removeItem(EC.Config.STORE_KEY); } catch (e) { /* 忽略 */ }
  }

  EC.Storage = {
    load: load,
    save: save,
    clear: clear,
    clone: clone,
    // 匯入檔案 / 備份插槽 / 回復預設值共用的工具
    buildState: buildState,
    snapshot: snapshot,
    normalizeSlots: normalizeSlots
  };
})();

/* ===================== 03-core-time.js ===================== */
/**
 * 核心：時間引擎（TimeEngine）
 * ------------------------------------------------------------------
 * 純函式、無副作用，負責所有時間換算與「場次階段」判定。
 * 上層只呼叫 compute() 取得畫面需要的一切，不自行算時間。
 *
 * 階段（phase）：
 *   idle   未選擇場次
 *   before 尚未開始
 *   live   進行中
 *   done   已結束
 */
(function () {
  'use strict';
  var EC = window.ExamClock;

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  /** "HH:MM" → 當日 0 時起算的分鐘數 */
  function toMinutes(hhmm) {
    if (!hhmm || hhmm.indexOf(':') === -1) return 0;
    var p = hhmm.split(':');
    return parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
  }

  /** 分鐘數 → "HH:MM" */
  function toClock(minutes) {
    var m = ((Math.round(minutes) % 1440) + 1440) % 1440;
    return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);
  }

  /** Date → 當日秒數（含秒） */
  function daySeconds(date) {
    return date.getHours() * 3600 + date.getMinutes() * 60 + date.getSeconds();
  }

  /** 秒數 → "MM:SS"，超過一小時顯示 "H:MM:SS" */
  function formatDuration(totalSec) {
    var sec = Math.max(0, Math.floor(totalSec));
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    var s = sec % 60;
    if (h > 0) return h + ':' + pad2(m) + ':' + pad2(s);
    return pad2(m) + ':' + pad2(s);
  }

  /** 秒數 → "H 時 M 分" 或 "M 分 S 秒" 的親切描述 */
  function humanize(totalSec) {
    var sec = Math.max(0, Math.floor(totalSec));
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    if (h > 0) return h + ' 小時 ' + m + ' 分';
    if (m > 0) return m + ' 分 ' + (sec % 60) + ' 秒';
    return sec + ' 秒';
  }

  function sessionSeconds(session) {
    return (toMinutes(session.end) - toMinutes(session.start)) * 60;
  }

  /**
   * 計算指定場次在 now 當下的完整狀態。
   * 回傳 { phase, label, remainingSec, elapsedRatio, startClock, endClock, durationSec, overrunSec }
   */
  function compute(session, now) {
    if (!session) {
      return {
        phase: 'idle', label: '等待選擇場次', remainingSec: 0, elapsedRatio: 0,
        startClock: '--:--', endClock: '--:--', durationSec: 0, overrunSec: 0
      };
    }
    var startSec = toMinutes(session.start) * 60;
    var endSec = toMinutes(session.end) * 60;
    if (endSec <= startSec) endSec += 86400; // 跨午夜保護
    var nowSec = daySeconds(now);
    if (nowSec < startSec - 21600) nowSec += 86400; // 深夜時區容錯
    var duration = Math.max(1, endSec - startSec);

    var phase, remainingSec, ratio;
    if (nowSec < startSec) {
      phase = 'before';
      remainingSec = startSec - nowSec;
      ratio = 0;
    } else if (nowSec < endSec) {
      phase = 'live';
      remainingSec = endSec - nowSec;
      ratio = (nowSec - startSec) / duration;
    } else {
      phase = 'done';
      remainingSec = 0;
      ratio = 1;
    }

    return {
      phase: phase,
      label: labelFor(phase),
      remainingSec: remainingSec,
      elapsedRatio: Math.min(1, Math.max(0, ratio)),
      startClock: session.start,
      endClock: session.end,
      durationSec: duration,
      overrunSec: phase === 'done' ? nowSec - endSec : 0
    };
  }

  function labelFor(phase) {
    if (phase === 'before') return '距離開始';
    if (phase === 'live') return '剩餘時間';
    if (phase === 'done') return '時間到';

/* ===================== 04-core-audio.js ===================== */
/**
 * 核心：音效引擎（AudioEngine）
 * ------------------------------------------------------------------
 * 以 Web Audio 合成提示音，不依賴任何外部音檔。共用單一 AudioContext。
 * 提供三種音色、音量控制、單發提示與試聽。
 *
 * 音量：所有音符先經過限制器（compressor）再套用補償增益（makeup），
 * 因此在不會破音的前提下，實際音量比單純正弦波大得多。
 */
(function () {
  'use strict';
  var EC = window.ExamClock;

  var ctx = null;
  var chainIn = null;

  function context() {
    var Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return null;
    if (!ctx) ctx = new Ctor();
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
    return ctx;
  }

  /** 主輸出鏈：限制器 + 補償增益（延遲建立、共用） */
  function output(ac) {
    if (!chainIn) {
      var comp = ac.createDynamicsCompressor();
      comp.threshold.value = -6;
      comp.knee.value = 12;
      comp.ratio.value = 8;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;

      var makeup = ac.createGain();
      makeup.gain.value = 1.6;

      comp.connect(makeup);
      makeup.connect(ac.destination);
      chainIn = comp;
    }
    return chainIn;
  }

  function clamp01(v, fallback) {
    var n = parseFloat(v);
    if (!isFinite(n)) n = fallback;
    return Math.min(1, Math.max(0, n));
  }

  /** 單一音符（正弦 + 八度泛音，聽起來更飽滿） */
  function note(ac, freq, at, dur, vol) {
    var node = ac.createGain();
    node.connect(output(ac));

    var main = ac.createOscillator();
    main.type = 'sine';
    main.frequency.value = freq;
    main.connect(node);

    var body = ac.createOscillator();
    body.type = 'sine';
    body.frequency.value = freq * 2;
    var bodyGain = ac.createGain();
    bodyGain.gain.value = 0.3;
    body.connect(bodyGain);
    bodyGain.connect(node);

    node.gain.setValueAtTime(0.0001, at);
    node.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), at + 0.03);
    node.gain.exponentialRampToValueAtTime(0.0001, at + dur);

    main.start(at); main.stop(at + dur + 0.05);
    body.start(at); body.stop(at + dur + 0.05);
  }

  var RECIPES = {
    chime: function (ac, t0, vol) {
      note(ac, 587.33, t0 + 0.0, 1.1, vol);
      note(ac, 493.88, t0 + 0.85, 1.1, vol);
      note(ac, 392.00, t0 + 1.70, 1.8, vol);
    },
    pulse: function (ac, t0, vol) {
      note(ac, 880.00, t0 + 0.0, 0.18, vol);
      note(ac, 880.00, t0 + 0.32, 0.18, vol);
    },
    rise: function (ac, t0, vol) {
      note(ac, 523.25, t0 + 0.0, 0.20, vol);
      note(ac, 659.25, t0 + 0.22, 0.20, vol);
      note(ac, 783.99, t0 + 0.44, 0.45, vol);
    }
  };

  /**
   * 播放指定音色。
   * @param {string} tone  chime | pulse | rise
   * @param {number} volume 0~1
   * @param {boolean} repeat 是否在 6 秒後重播一次
   */
  function play(tone, volume, repeat) {
    try {
      var ac = context();
      if (!ac) return;
      var vol = clamp01(volume, 0.8);
      var recipe = RECIPES[tone] || RECIPES.chime;
      var t0 = ac.currentTime + 0.05;
      recipe(ac, t0, vol);
      if (repeat) recipe(ac, t0 + 6, vol);
    } catch (e) {
      console.warn('[ExamClock] 音效播放失敗：', e);
    }
  }

  /** 短促警示音（用於最後倒數提醒） */
  function warn(volume) {
    try {
      var ac = context();
      if (!ac) return;
      var vol = clamp01(volume, 0.8) * 0.85;
      note(ac, 880.00, ac.currentTime + 0.02, 0.16, vol);
      note(ac, 880.00, ac.currentTime + 0.30, 0.16, vol);
    } catch (e) {
      console.warn('[ExamClock] 音效播放失敗：', e);
    }
  }

  EC.Audio = EC.Audio || {};
  EC.AudioEngine = {
    play: play,
    warn: warn,
    unlock: function () { context(); }
  };
})();

/* ===================== 06-core-hooks.js ===================== */
/**
 * 核心：React Hooks 工具箱
 * ------------------------------------------------------------------
 * useTicker      每秒（或指定間隔）更新一次的 Date
 * useFullscreen  全螢幕切換
 * useWakeLock    投影時避免螢幕休眠（若瀏覽器支援）
 * useDebouncedSave 將狀態變更延遲寫入儲存層
 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useRef = React.useRef;
  var useCallback = React.useCallback;

  function useTicker(intervalMs) {
    var pair = useState(function () { return new Date(); });
    var now = pair[0];
    var setNow = pair[1];
    useEffect(function () {
      var ms = intervalMs || 1000;
      var id = setInterval(function () { setNow(new Date()); }, ms);
      return function () { clearInterval(id); };
    }, [intervalMs]);
    return now;
  }

  function useFullscreen(targetRef) {
    var pair = useState(false);
    var isFull = pair[0];
    var setFull = pair[1];

    useEffect(function () {
      function onChange() { setFull(!!document.fullscreenElement); }
      document.addEventListener('fullscreenchange', onChange);
      return function () { document.removeEventListener('fullscreenchange', onChange); };
    }, []);

    var toggle = useCallback(function () {
      var el = (targetRef && targetRef.current) || document.documentElement;
      if (document.fullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
      } else if (el.requestFullscreen) {
        el.requestFullscreen().catch(function () { /* 使用者拒絕或不支援 */ });
      }
    }, [targetRef]);

    return [isFull, toggle];
  }

  function useWakeLock() {
    var ref = useRef(null);
    var pair = useState(false);
    var active = pair[0];
    var setActive = pair[1];

    var request = useCallback(function () {
      if (!('wakeLock' in navigator)) return;
      navigator.wakeLock.request('screen').then(function (lock) {
        ref.current = lock;
        setActive(true);
        lock.addEventListener('release', function () { setActive(false); });
      }).catch(function () { /* 被拒絕 */ });
    }, []);

    var release = useCallback(function () {
      if (ref.current) {
        try { ref.current.release(); } catch (e) { /* 忽略 */ }
        ref.current = null;
      }
      setActive(false);
    }, []);

    return [active, request, release];
  }

  /** 狀態變更後延遲寫入，避免每秒都寫 localStorage */
  function useDebouncedEffect(effect, deps, delayMs) {
    useEffect(function () {
      var id = setTimeout(effect, delayMs == null ? 300 : delayMs);
      return function () { clearTimeout(id); };
    }, deps);
  }

  /**
   * 量測某個元素的可用尺寸（回傳 [ref, { width, height }]）。
   * 給「要依剩餘空間自動縮放」的畫面用，例如投影的倒數圓環；
   * 視窗縮放或版面變動時會自動重新量測。
   */
  function useElementSize() {
    var ref = useRef(null);
    var pair = useState({ width: 0, height: 0 });
    var size = pair[0];
    var setSize = pair[1];

    useEffect(function () {
      var el = ref.current;
      if (!el) return undefined;

      function measure() {
        var r = el.getBoundingClientRect();
        setSize(function (prev) {
          if (Math.abs(prev.width - r.width) < 1 && Math.abs(prev.height - r.height) < 1) return prev;
          return { width: r.width, height: r.height };
        });
      }

      measure();

      var ro = null;
      if (typeof ResizeObserver !== 'undefined') {
        ro = new ResizeObserver(measure);
        ro.observe(el);
      }
      window.addEventListener('resize', measure);
      window.addEventListener('orientationchange', measure);
      return function () {
        if (ro) ro.disconnect();
        window.removeEventListener('resize', measure);
        window.removeEventListener('orientationchange', measure);
      };
    }, []);

    return [ref, size];
  }

  EC.Hooks = {
    useTicker: useTicker,
    useFullscreen: useFullscreen,
    useWakeLock: useWakeLock,
    useDebouncedEffect: useDebouncedEffect,
    useElementSize: useElementSize
  };
})();

/**
 * 狀態：Store（reducer 與動作建立器）
 * ------------------------------------------------------------------
 * 全應用只有這一個 reducer。畫面元件不直接改狀態，
 * 一律 dispatch 動作，讓資料流單純、可預期、易除錯。
 */
(function () {
  'use strict';
  var EC = window.ExamClock;

  var A = {
    selectSession: function (id) { return { type: 'SELECT_SESSION', id: id }; },
    addSession: function (session) { return { type: 'ADD_SESSION', session: session }; },
    updateSession: function (session) { return { type: 'UPDATE_SESSION', session: session }; },
    deleteSession: function (id) { return { type: 'DELETE_SESSION', id: id }; },

    duplicateSession: function (id) { return { type: 'DUPLICATE_SESSION', id: id }; },

    setAttendance: function (key, value) { return { type: 'SET_ATTENDANCE', key: key, value: value }; },
    addAnnouncement: function (text) { return { type: 'ADD_ANNOUNCEMENT', text: text }; },
    updateAnnouncement: function (id, patch) { return { type: 'UPDATE_ANNOUNCEMENT', id: id, patch: patch }; },
    deleteAnnouncement: function (id) { return { type: 'DELETE_ANNOUNCEMENT', id: id }; },
    addNote: function (text) { return { type: 'ADD_NOTE', text: text }; },
    deleteNote: function (id) { return { type: 'DELETE_NOTE', id: id }; },
    clearNotes: function () { return { type: 'CLEAR_NOTES' }; },
    updateSettings: function (patch) { return { type: 'UPDATE_SETTINGS', patch: patch }; },
    saveSlot: function (index, name, data) { return { type: 'SAVE_SLOT', index: index, name: name, data: data }; },
    updateSlot: function (index, patch) { return { type: 'UPDATE_SLOT', index: index, patch: patch }; },
    clearSlot: function (index) { return { type: 'CLEAR_SLOT', index: index }; },
    replaceAll: function (state) { return { type: 'REPLACE_ALL', state: state }; },

      case 'ADD_ANNOUNCEMENT':
        return Object.assign({}, state, {

    rose: 'border-rose-100 bg-rose-50 text-rose-500',
    violet: 'border-indigo-100 bg-indigo-50 text-indigo-500',
    cyan: 'border-cyan-100 bg-cyan-50 text-cyan-600',
    slate: 'border-slate-200 bg-slate-100 text-slate-500'
  };

  // 投影／深色底用的高對比膠囊：底色更實、文字更亮（遠距離也要看得清楚）
  var TONES_DARK = {
    indigo: 'border-indigo-300/40 bg-indigo-500/25 text-indigo-50',
    teal: 'border-teal-300/40 bg-teal-500/25 text-teal-50',
    amber: 'border-amber-300/50 bg-amber-500/25 text-amber-50',
    rose: 'border-rose-300/40 bg-rose-500/25 text-rose-50',
    violet: 'border-violet-300/40 bg-violet-500/25 text-violet-50',
    cyan: 'border-cyan-300/40 bg-cyan-500/25 text-cyan-50',
    slate: 'border-white/25 bg-white/15 text-white'
  };

  UI.toneClasses = function (tone, dark) {
    var map = dark ? TONES_DARK : TONES_LIGHT;
    return 'inline-flex items-center gap-1.5 rounded-full border px-3 py-1 text-sm font-bold ' +
      (map[tone] || map.slate);
  };
})();

/* ===================== 20-panel-sessions.js ===================== */
/**
 * 面板：場次排程（SessionsPanel）
 * ------------------------------------------------------------------
 * 新增 / 編輯 / 排序 / 複製 / 刪除考試場次，並提供快速套用範本。
 *
 * 選取回饋（重點）：
 *   選取中的場次使用「漸層外框 + 白底 + 陰影 + 目前標籤」強烈標示，
 *   並以時間即時判斷該場次是否「進行中」，讓老師一眼分辨。
 *
 * props：
 *   sessions, activeId,
 *   onSelect(id), onAdd(session), onUpdate(session), onDelete(id),
 *   onMove(id, delta), onDuplicate(id), onApplyPreset(sessions)
 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var UI = EC.UI;
  var Icons = EC.Icons;
  var useState = React.useState;

  var TINTS = ['indigo', 'teal', 'amber', 'rose', 'violet', 'cyan'];
  var BLANK = { title: '', start: '08:00', end: '08:40', tint: 'indigo' };

  var DOT = {
    indigo: 'bg-sky-500', teal: 'bg-teal-400', amber: 'bg-amber-400',
    rose: 'bg-rose-400', violet: 'bg-indigo-400', cyan: 'bg-cyan-400'
  };

  EC.UI.SessionsPanel = function SessionsPanel(props) {
    var editingPair = useState(null); // null | 'new' | id
    var editing = editingPair[0];
    var setEditing = editingPair[1];

    var formPair = useState(BLANK);
    var form = formPair[0];
    var setForm = formPair[1];

    var errPair = useState('');
    var error = errPair[0];
    var setError = errPair[1];

    var presetPair = useState(EC.Config.presets[0].key);
    var presetKey = presetPair[0];
    var setPresetKey = presetPair[1];

    function openNew() { setEditing('new'); setForm(BLANK); setError(''); }
    function openEdit(s) {
      setEditing(s.id);
      setForm({ title: s.title, start: s.start, end: s.end, tint: s.tint });
      setError('');
    }
    function close() { setEditing(null); setError(''); }

    function submit() {
      if (!form.title.trim()) { setError('請輸入場次名稱'); return; }
      if (EC.TimeEngine.toMinutes(form.end) <= EC.TimeEngine.toMinutes(form.start)) {
        setError('結束時間需晚於開始時間'); return;
      }
      var payload = {
        id: editing === 'new' ? EC.Store.uid('s') : editing,
        title: form.title.trim(),
        start: form.start, end: form.end, tint: form.tint
      };
      if (editing === 'new') props.onAdd(payload); else props.onUpdate(payload);
      close();
    }

    var now = new Date();

    return (
      <UI.Card title="考試場次" icon="calendar"
        actions={<UI.Button variant="primary" icon="plus" onClick={openNew}>新增</UI.Button>}>
        {editing && (
          <div className="mb-4 space-y-3 rounded-2xl border border-sky-100 bg-sky-50/70 p-4">
            <UI.Field label="場次名稱">
              <input className={UI.inputClass} value={form.title} placeholder="例如：第一節"
                onChange={function (e) { setForm(Object.assign({}, form, { title: e.target.value })); }} />
            </UI.Field>
            <div className="grid grid-cols-2 gap-3">
              <UI.Field label="開始時間">
                <input type="time" className={UI.inputClass} value={form.start}
                  onChange={function (e) { setForm(Object.assign({}, form, { start: e.target.value })); }} />
              </UI.Field>
              <UI.Field label="結束時間">
                <input type="time" className={UI.inputClass} value={form.end}
                  onChange={function (e) { setForm(Object.assign({}, form, { end: e.target.value })); }} />
              </UI.Field>
            </div>
            <UI.Field label="標籤顏色">
              <div className="flex flex-wrap gap-2">
                {TINTS.map(function (t) {
                  return (
                    <button key={t} type="button"
                      title={t}
                      onClick={function () { setForm(Object.assign({}, form, { tint: t })); }}
                      className={['h-8 w-8 rounded-xl transition-transform hover:scale-110 ' + (DOT[t] || 'bg-slate-400'),
                        form.tint === t ? 'ring-2 ring-slate-500 ring-offset-2' : ''].join(' ')} />
                  );
                })}
              </div>
            </UI.Field>
            {error && <p className="text-xs font-bold text-rose-600">{error}</p>}
            <div className="flex gap-2">
              <UI.Button variant="primary" icon="check" onClick={submit}>儲存</UI.Button>
              <UI.Button icon="close" onClick={close}>取消</UI.Button>
            </div>
          </div>
        )}

        <div className="space-y-2.5">
          {props.sessions.length === 0 && (
            <p className="rounded-2xl border border-dashed border-slate-300 py-8 text-center text-sm font-semibold text-slate-400">
              尚未建立場次，點右上角「新增」
            </p>
          )}

          {props.sessions.map(function (s, i) {
            var active = s.id === props.activeId;
            var live = EC.TimeEngine.compute(s, now).phase === 'live';
            var mins = Math.round(EC.TimeEngine.sessionSeconds(s) / 60);

            return (
              <div key={s.id}
                onClick={function () { props.onSelect(s.id); }}
                className={['group cursor-pointer rounded-2xl transition-all duration-200 ',
                  active
                    ? 'bg-gradient-to-r from-sky-400 to-indigo-400 p-[2.5px] shadow-lg shadow-sky-300/40'
                    : 'p-[2.5px] hover:shadow-md'].join(' ')}>
                <div className={['flex items-center gap-3 rounded-[14px] p-3.5 transition-colors',
                  active ? 'bg-white' : 'border border-slate-200 bg-white/70 group-hover:border-sky-200'].join(' ')}>

                  {/* 顏色指示 */}
                  <span className={['h-10 w-1.5 shrink-0 rounded-full ' + (DOT[s.tint] || 'bg-slate-400')].join(' ')} />

                  <div className="min-w-0 flex-1">
                    <div className="flex items-center gap-2">
                      <p className={['truncate font-black tracking-tight',
                        active ? 'text-base text-slate-800' : 'text-sm text-slate-700'].join(' ')}>
                        {s.title}
                      </p>
                      {active && (
                        <span className="inline-flex shrink-0 items-center gap-1 rounded-full bg-gradient-to-r from-sky-400 to-indigo-400 px-2 py-0.5 text-[10px] font-black text-white">
                          <span className="h-1.5 w-1.5 rounded-full bg-white" />目前
                        </span>
                      )}
                      {live && !active && (
                        <span className="inline-flex shrink-0 items-center gap-1 rounded-full border border-teal-200 bg-teal-50 px-2 py-0.5 text-[10px] font-black text-teal-600">
                          <span className="h-1.5 w-1.5 animate-pulse rounded-full bg-teal-500" />進行中
                        </span>
                      )}
                    </div>
                    <p className={['mt-0.5 font-mono text-xs font-bold tabular-nums',
                      active ? 'text-sky-500' : 'text-slate-400'].join(' ')}>
                      {s.start} – {s.end} · {mins} 分
                    </p>
                  </div>

                  <div className="flex shrink-0 items-center gap-1 opacity-50 transition-opacity group-hover:opacity-100">
                    <UI.IconButton icon="chevronUp" title="上移" compact
                      onClick={function (e) { e.stopPropagation(); props.onMove(s.id, -1); }} />
                    <UI.IconButton icon="chevronDown" title="下移" compact
                      onClick={function (e) { e.stopPropagation(); props.onMove(s.id, 1); }} />
                    <UI.IconButton icon="copy" title="複製" compact
                      onClick={function (e) { e.stopPropagation(); props.onDuplicate(s.id); }} />
                    <UI.IconButton icon="pencil" title="編輯" compact
                      onClick={function (e) { e.stopPropagation(); openEdit(s); }} />
                    <UI.IconButton icon="trash" title="刪除" compact className="hover:text-rose-500"
                      onClick={function (e) { e.stopPropagation(); props.onDelete(s); }} />
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        <div className="mt-4 flex items-center gap-2 border-t border-slate-100 pt-4">
          <span className="shrink-0 text-xs font-bold text-slate-400">快速範本</span>
          <select className={UI.inputClass + ' flex-1'}
            value={presetKey} onChange={function (e) { setPresetKey(e.target.value); }}>
            {EC.Config.presets.map(function (p) {
              return <option key={p.key} value={p.key}>{p.label}</option>;
            })}
          </select>
          <UI.Button icon="sparkles"
            onClick={function () {
              var found = EC.Config.presets.filter(function (p) { return p.key === presetKey; })[0];
              if (found) props.onApplyPreset(found.build());
            }}>套用</UI.Button>
        </div>
      </UI.Card>
    );
  };
})();

/**
 * 面板：主計時（TimerPanel）— 發光圓環主角
 * ------------------------------------------------------------------
 * 以大圓環 + 漸層數字呈現剩餘時間，右側為場次資訊、進度與操作。
 * props：
 *   session, info(TimeEngine.compute 結果), next, warning,
 *   onOpenStage(), onPrev(), onNext()
 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var UI = EC.UI;
  var Icons = EC.Icons;

  var PHASE_META = {
    idle: { text: '待機', tone: 'slate', ring: 'slate', num: 'from-slate-400 to-slate-500' },
    before: { text: '準備中', tone: 'amber', ring: 'slate', num: 'from-slate-400 to-slate-600' },
    live: { text: '進行中', tone: 'teal', ring: 'indigo', num: 'from-sky-500 to-indigo-500' },
    done: { text: '已結束', tone: 'rose', ring: 'rose', num: 'from-rose-400 to-pink-500' }
  };

  EC.UI.TimerPanel = function TimerPanel(props) {
    var info = props.info;
    var session = props.session;
    var warn = props.warning && info.phase === 'live';
    var meta = PHASE_META[info.phase] || PHASE_META.idle;
    var ring = warn ? 'amber' : meta.ring;
    var numTone = warn ? 'from-amber-500 to-orange-500' : meta.num;
    var time = EC.TimeEngine.formatDuration(info.remainingSec);
    var numSize = time.length > 5 ? 'text-4xl' : 'text-5xl sm:text-[3.4rem]';
    var pct = Math.round(info.elapsedRatio * 100);

    return (
      <UI.Card pad={false}>
        <div className="grid items-center gap-6 p-6 sm:grid-cols-[auto_1fr]">
          {/* 圓環 */}
          <div className="mx-auto">
            <UI.ProgressRing size={236} ratio={info.elapsedRatio} tone={ring} thickness={13}>
              <p className="text-[11px] font-black uppercase tracking-[0.28em] text-slate-500">{info.label}</p>
              <p className={['mt-1 bg-gradient-to-r bg-clip-text font-mono font-black tabular-nums leading-none text-transparent ' + numTone + ' ' + numSize].join(' ')}>
                {time}
              </p>
              <p className="mt-1.5 text-xs font-bold text-slate-500 tabular-nums">{pct}%</p>
            </UI.ProgressRing>
          </div>

          {/* 資訊 */}
          <div className="min-w-0 space-y-4">
            <div className="flex flex-wrap items-center gap-2">
              <span className={UI.toneClasses(meta.tone)}>
                <span className={['h-2 w-2 rounded-full bg-current', info.phase === 'live' ? 'animate-pulse' : 'opacity-50'].join(' ')} />
                {meta.text}
              </span>
              {session ? (
                <span className="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white/70 px-3 py-1 font-mono text-sm font-bold text-slate-500 tabular-nums">
                  {Icons.get('clock', { size: 15 })}
                  {session.start} – {session.end}
                </span>
              ) : null}
            </div>

            <div>
              <h2 className="truncate text-2xl font-black tracking-tight text-slate-800 sm:text-3xl">
                {session ? session.title : '尚未選擇場次'}
              </h2>
              {session ? (
                <p className="mt-1 text-sm font-semibold text-slate-500">
                  全長 {Math.round(info.durationSec / 60)} 分鐘
                </p>
              ) : (
                <p className="mt-1 text-sm text-slate-500">請從左側場次清單選擇</p>
              )}
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <UI.Button icon="chevronUp" onClick={props.onPrev}>上一場</UI.Button>
              <UI.Button icon="chevronDown" onClick={props.onNext}>下一場</UI.Button>
              <UI.Button variant="primary" icon="expand" onClick={props.onOpenStage}>投影模式</UI.Button>
            </div>

            {props.next && (
              <div className="flex items-center gap-2 rounded-2xl border border-slate-100 bg-slate-50/80 px-4 py-2.5 text-sm">
                <span className="flex h-7 w-7 items-center justify-center rounded-lg bg-white text-sky-500 shadow-sm">
                  {Icons.get('chevronDown', { size: 15 })}
                </span>
                <span className="font-bold text-slate-500">下一場</span>
                <span className="truncate font-bold text-slate-700">{props.next.title}</span>
                <span className="ml-auto font-mono text-slate-500 tabular-nums">{props.next.start}–{props.next.end}</span>
              </div>
            )}
          </div>
        </div>
      </UI.Card>
    );
  };
})();


/* ===================== 22-panel-alerts.js ===================== */
/**
 * 面板：提示音設定（AlertsPanel）
 * ------------------------------------------------------------------
 * 選擇音色與音量、試聽、設定開始／結束提醒與最後倒數警示、自動換場延遲。

 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var UI = EC.UI;
  var Icons = EC.Icons;
  var lim = EC.Config.limits;

  EC.UI.AlertsPanel = function AlertsPanel(props) {
    var s = props.settings;
    var set = function (patch) { props.onUpdate(patch); };

    return (
      <UI.Card title="提示音" icon="bell"
        actions={<UI.Button icon="volume" onClick={function () { props.onTest(s.tone, s.volume); }}>試聽</UI.Button>}>
        <div className="space-y-4">
          <UI.Field label="音色">
            <select className={UI.inputClass} value={s.tone}
              onChange={function (e) { set({ tone: e.target.value }); }}>

              })}
            </select>
          </UI.Field>

          <div>
            <div className="mb-1 flex items-center justify-between text-xs font-semibold text-slate-500">
              <span>音量</span>
              <span className="tabular-nums">{Math.round(s.volume * 100)}%</span>
            </div>
            <input type="range" min="0" max="1" step="0.05" value={s.volume}
              onChange={function (e) { set({ volume: parseFloat(e.target.value) }); }}
              className="w-full accent-sky-500" />
          </div>

          <div className="space-y-3 rounded-xl border border-slate-100 bg-slate-50 p-3">
            <UI.Toggle label="開始時響鈴" checked={s.bellAtStart}
              onChange={function (v) { set({ bellAtStart: v }); }} />
            <UI.Toggle label="結束時響鈴" checked={s.bellAtEnd}
              onChange={function (v) { set({ bellAtEnd: v }); }} />
            <UI.Toggle label="進入投影模式" checked={s.autoStage}
              onChange={function (v) { set({ autoStage: v }); }} />
            <UI.Toggle label="結束後自動換下一場" checked={s.autoAdvanceNext !== false}
              onChange={function (v) { set({ autoAdvanceNext: v }); }} />
          </div>

          <div className="flex items-center justify-between gap-3">
            <span className="text-sm font-medium text-slate-700">最後警示（分）</span>
            <UI.Stepper value={s.warnMinutes} step={1}
              format={function (v) { return v + ' 分'; }}
              onChange={function (v) {
                set({ warnMinutes: Math.min(lim.maxWarnMinutes, Math.max(lim.minWarnMinutes, Math.round(v))) });
              }} />
          </div>

          <div className="flex items-center justify-between gap-3">
            <span className="text-sm font-medium text-slate-700">結束後自動換場（秒）</span>
            <UI.Stepper value={s.advanceDelaySec} step={2}
              format={function (v) { return v + ' 秒'; }}
              onChange={function (v) {
                set({ advanceDelaySec: Math.min(lim.maxAdvanceSec, Math.max(lim.minAdvanceSec, Math.round(v))) });
              }} />
          </div>
        </div>
      </UI.Card>
    );
  };
})();


/* ===================== 23-panel-announcements.js ===================== */
/**
 * 面板：老師小叮嚀（AnnouncementsPanel）
 * ------------------------------------------------------------------
 * 管理者新增提醒事項、開關顯示、設為「聚焦」（投影時放大強調）。
 * 另有「建議用語」：常用提醒一鍵帶入輸入框，可再修改後按「加入」。
 * 投影端字級（小叮嚀字級）由設定面板調整、各檢視畫面套用。
 * props：announcements, onAdd(text), onUpdate(id, patch), onDelete(id)
 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var UI = EC.UI;
  var Icons = EC.Icons;
  var useState = React.useState;

  /**
   * 建議用語：教師常用的考前／考中提醒，點一下帶入輸入框（可再修改後按「加入」）。
   * 每個句子都有自己的彩色圖示（tone 對應 UI.BADGE_TONE）。
   * 要增減句子只改這個陣列，其他功能不受影響。
   */
  var SUGGEST = [
    { text: '寫完別急著交卷，從頭再檢查一遍', icon: 'check', tone: 'emerald' },
    { text: '交卷前，確認班級、姓名、座號都寫了', icon: 'pencil', tone: 'fuchsia' },
    { text: '不會的先跳過，回頭再想，別卡住', icon: 'refresh', tone: 'sky' },
    { text: '畫卡請對準題號，小心不要跳格', icon: 'target', tone: 'indigo' },
    { text: '注意時間，預留 5 分鐘再檢查一次', icon: 'clock', tone: 'amber' },
    { text: '有問題請舉手，保持安靜', icon: 'users', tone: 'violet' }
  ];

  EC.UI.AnnouncementsPanel = function AnnouncementsPanel(props) {
    var inputPair = useState('');
    var text = inputPair[0];
    var setText = inputPair[1];
    var inputRef = React.useRef(null);

    function submit(e) {
      e.preventDefault();
      if (!text.trim()) return;
      props.onAdd(text.trim());
      setText('');
    }

    /** 建議用語：帶入輸入框並把游標放到最後，方便直接修改或按「加入」。 */
    function useSuggestion(s) {
      setText(s.text);
      if (inputRef.current) {
        inputRef.current.focus();
        var n = s.text.length;
        try { inputRef.current.setSelectionRange(n, n); } catch (err) { /* 忽略 */ }
      }
    }

    var enabledCount = props.announcements.filter(function (a) { return a.enabled; }).length;

    return (
      <UI.Card title="老師小叮嚀" icon="megaphone"
        actions={<span className="text-xs font-semibold text-slate-400">{enabledCount} / {props.announcements.length} 顯示中</span>}>
        <form onSubmit={submit} className="mb-2 flex gap-2">
          <input ref={inputRef} className={UI.inputClass} placeholder="輸入提醒文字…" value={text}
            onChange={function (e) { setText(e.target.value); }} />
          <UI.Button variant="primary" icon="plus" onClick={submit}>加入</UI.Button>
        </form>

        <div className="mb-3">
          <p className="mb-1.5 text-xs font-semibold text-slate-400">建議用語（點一下帶入，可再修改）</p>
          <div className="flex flex-wrap gap-1.5">
            {SUGGEST.map(function (s) {
              return (
                <button key={s.text} type="button"
                  onClick={function () { useSuggestion(s); }}
                  className="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white py-1 pl-1 pr-3 text-xs font-semibold text-slate-600 shadow-sm transition hover:-translate-y-0.5 hover:border-sky-300 hover:text-sky-700 active:bg-sky-50">
                  <UI.IconBadge icon={s.icon} tone={s.tone} round size="h-5 w-5" iconSize={12} />
                  {s.text}
                </button>
              );
            })}

        </div>

        <div className="max-h-64 space-y-2 overflow-y-auto pr-1">
          {props.announcements.length === 0 && (
            <p className="rounded-xl border border-dashed border-slate-200 py-5 text-center text-sm text-slate-400">
              目前沒有公告
            </p>
          )}
          {props.announcements.map(function (a) {
            return (
              <div key={a.id}
                className={[
                  'flex items-center gap-2 rounded-xl border p-2.5 transition',
                  a.enabled ? 'border-slate-200 bg-white' : 'border-dashed border-slate-200 bg-slate-50 opacity-60'
                ].join(' ')}>
                <button type="button" onClick={function () { props.onUpdate(a.id, { enabled: !a.enabled }); }}
                  title={a.enabled ? '點擊隱藏' : '點擊顯示'}
                  className={['flex h-8 w-8 shrink-0 items-center justify-center rounded-lg border',
                    a.enabled ? 'border-teal-200 bg-teal-50 text-teal-600' : 'border-slate-200 bg-white text-slate-300'].join(' ')}>
                  {Icons.get('check', { size: 16 })}
                </button>
                <span className={['min-w-0 flex-1 text-sm', a.enabled ? 'text-slate-700' : 'text-slate-400 line-through'].join(' ')}>
                  {a.text}
                </span>
                <UI.IconButton icon="star" title="聚焦強調" active={a.pinned}
                  onClick={function () { props.onUpdate(a.id, { pinned: !a.pinned }); }} />
                <UI.IconButton icon="trash" title="刪除" className="text-rose-500"
                  onClick={function () { props.onDelete(a.id); }} />
              </div>
            );
          })}
        </div>
      </UI.Card>
    );
  };
})();

(function () {

/* ===================== 25-panel-notes.js ===================== */
/**
 * 面板：即時紀錄（NotesPanel）
 * ------------------------------------------------------------------
 * 以帶時間戳的條目記錄考場事件（如廁、交卷、試題疑義）。
 *
 * 輸入流程（重點）：
 *   1. 點下方標籤，只會把文字「帶入輸入框」，不會立刻存檔。
 *   2. 使用者接著補上座號（例如「提早交卷：」後輸入「1號」）。
 *   3. 按 Enter 或「記錄」才存檔，並自動清空、重新聚焦，方便連續輸入。
 *
 * props：notes, onAdd(text), onDelete(id), onClear()
 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var UI = EC.UI;
  var Icons = EC.Icons;
  var useState = React.useState;
  var useRef = React.useRef;

  /**
   * 即時紀錄的快速標籤：以「學生在考場可能發生的情況」設計。
   * 每個標籤都有專屬彩色圖示（tone 對應 UI.BADGE_TONE）。
   * text 結尾固定用「：」，方便接著輸入座號（例：提早交卷：1號）。
   */
  var QUICK = [
    { label: '提早交卷', text: '提早交卷：', icon: 'check', tone: 'emerald' },
    { label: '如廁', text: '如廁：', icon: 'arrowRight', tone: 'cyan' },
    { label: '身體不適', text: '身體不適：', icon: 'heart', tone: 'amber' },
    { label: '試題疑義', text: '試題疑義：', icon: 'question', tone: 'violet' },
    { label: '遲到入場', text: '遲到入場：', icon: 'clock', tone: 'sky' },
    { label: '文具借用', text: '文具借用：', icon: 'pencil', tone: 'fuchsia' },
    { label: '中途離場', text: '中途離場：', icon: 'flag', tone: 'indigo' },
    { label: '違規處理', text: '違規處理：', icon: 'warning', tone: 'rose' }
  ];

  function timeOf(iso) {
    var d = new Date(iso);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  EC.UI.NotesPanel = function NotesPanel(props) {
    var draftPair = useState('');
    var draft = draftPair[0];
    var setDraft = draftPair[1];

    var inputRef = useRef(null);

    /** 把文字插入輸入框目前的游標位置（若無游標則接在最後） */
    function insertText(text) {
      var el = inputRef.current;
      var start = el && el.selectionStart != null ? el.selectionStart : draft.length;
      var end = el && el.selectionEnd != null ? el.selectionEnd : draft.length;
      var next = draft.slice(0, start) + text + draft.slice(end);
      setDraft(next);
      var caret = start + text.length;
      window.requestAnimationFrame(function () {
        if (!el) return;
        el.focus();
        try { el.setSelectionRange(caret, caret); } catch (e) { /* 忽略 */ }
      });
    }

    function onQuick(q) {
      if (q.now) {
        var d = new Date();
        insertText(('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2));
      } else {
        insertText(q.text);
      }
    }

    function record() {
      if (!draft.trim()) return;
      props.onAdd(draft.trim());
      setDraft('');
      window.requestAnimationFrame(function () {
        if (inputRef.current) inputRef.current.focus();
      });
    }

    return (
      <UI.Card title="即時紀錄" icon="note"
        actions={
          <UI.Button icon="trash" variant="danger"
            onClick={function () { if (props.notes.length) props.onClear(); }}>清空</UI.Button>
        }>
        <p className="mb-2 text-xs text-slate-400">
          點標籤帶入文字，補上座號後按 Enter 儲存。
        </p>

        <div className="mb-2 flex flex-wrap gap-1.5">
          {QUICK.map(function (q) {
            return (
              <button key={q.label} type="button"
                onClick={function () { onQuick(q); }}
                className="inline-flex items-center gap-1.5 rounded-full border border-slate-200 bg-white py-1 pl-1 pr-3 text-xs font-semibold text-slate-600 shadow-sm transition hover:-translate-y-0.5 hover:border-sky-300 hover:text-sky-700 active:bg-sky-50">
                <UI.IconBadge icon={q.icon} tone={q.tone} round size="h-5 w-5" iconSize={12} />
                {q.label}
              </button>
            );
          })}
        </div>

        <div className="flex gap-2">
          <input ref={inputRef} className={UI.inputClass}
            placeholder="例：提早交卷：1號" value={draft}
            onChange={function (e) { setDraft(e.target.value); }}
            onKeyDown={function (e) { if (e.key === 'Enter') record(); }} />
          <UI.Button variant="primary" icon="plus" onClick={record}>記錄</UI.Button>
        </div>

        <ul className="mt-3 max-h-48 space-y-1.5 overflow-y-auto pr-1">
          {props.notes.length === 0 && (
            <li className="rounded-xl border border-dashed border-slate-200 py-5 text-center text-sm text-slate-400">
              尚無紀錄
            </li>
          )}
          {props.notes.map(function (n) {
            return (
              <li key={n.id} className="group flex items-start gap-2 rounded-lg px-2 py-1.5 hover:bg-slate-50">
                <span className="mt-0.5 font-mono text-xs font-semibold text-sky-500 tabular-nums">{timeOf(n.at)}</span>
                <span className="min-w-0 flex-1 break-words text-sm text-slate-700">{n.text}</span>
                <button type="button" onClick={function () { props.onDelete(n.id); }}
                  className="shrink-0 text-slate-300 opacity-0 transition group-hover:opacity-100 hover:text-rose-500">
                  {Icons.get('close', { size: 15 })}
                </button>
              </li>
            );
          })}
        </ul>
      </UI.Card>
    );
  };
})();


/* ===================== 26-panel-settings.js ===================== */
/**
 * 面板：設定與備份（SettingsPanel）
 * ------------------------------------------------------------------
 * 1. 一般設定（24 小時制、小叮嚀字級）。
 * 2. 設定備份：固定 5 組插槽，每組可自己命名，可選「存到哪一組」、
 *    「從哪一組還原」，還原時其他 4 組備份不會被蓋掉。
 * 3. 匯出／匯入成 JSON 檔案（換裝置用）。
 * 4. 回復預設值：固定回到最原始出廠狀態（不是任何一組備份），
 *    但保留 5 組備份插槽，讓使用者還原得回來。
 * props：settings, onUpdate(patch), onSaveSlot(i, name), onRenameSlot(i, name),
 *   onRestoreSlot(i), onClearSlot(i), onExport, onImportFile, onReset
 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var UI = EC.UI;
  var Icons = EC.Icons;
  var useRef = React.useRef;

  var lim = EC.Config.limits;

  /** 每一組插槽的代表色（依序循環） */
  var SLOT_TONES = ['indigo', 'sky', 'emerald', 'amber', 'rose'];

  /** 小圓角按鈕（比 UI.Button 更精簡，5 組排起來才不會太擠） */
  var PILL = {
    sky: 'border-sky-200 bg-sky-50 text-sky-700 hover:bg-sky-100',
    emerald: 'border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100',
    rose: 'border-rose-200 bg-rose-50 text-rose-600 hover:bg-rose-100'
  };
  var PILL_BASE = 'inline-flex items-center gap-1 rounded-full border px-2.5 py-1 text-xs font-bold transition active:scale-95 disabled:cursor-not-allowed disabled:opacity-40';

  var NAME_INPUT =
    'w-full min-w-0 rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-sm font-semibold ' +
    'text-slate-700 outline-none transition placeholder:font-normal placeholder:text-slate-300 ' +
    'focus:border-sky-300 focus:ring-2 focus:ring-sky-100';

  function savedLabel(iso) {
    if (!iso) return '尚未儲存';
    var d = new Date(iso);
    function p(n) { return ('0' + n).slice(-2); }
    return '已存 ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  EC.UI.SettingsPanel = function SettingsPanel(props) {
    var s = props.settings;
    var fileRef = useRef(null);
    var slots = s.slots || [];

    return (
      <UI.Card title="設定與備份" icon="settings">
        <div className="space-y-4">
          <div className="flex items-center justify-between gap-3">
            <span className="text-sm font-medium text-slate-700">24 小時制</span>
            <UI.Toggle label="" checked={s.clock24}
              onChange={function (v) { props.onUpdate({ clock24: v }); }} />
          </div>

          <div className="space-y-2">
            <div className="flex items-center justify-between gap-3">
              <span className="text-sm font-medium text-slate-700">小叮嚀字級</span>
              <span className="font-mono text-sm font-black tabular-nums text-sky-600">{Math.round(s.fontScale * 100)}%</span>
            </div>
            <input type="range" min={lim.minFontScale * 100} max={lim.maxFontScale * 100} step={5}
              value={Math.round(s.fontScale * 100)}
              onChange={function (e) {
                props.onUpdate({ fontScale: Math.min(lim.maxFontScale, Math.max(lim.minFontScale, parseInt(e.target.value, 10) / 100)) });
              }}
              className="w-full accent-sky-500" />
            <p className="text-xs text-slate-400">調整投影畫面上「老師小叮嚀」的文字大小（{Math.round(lim.minFontScale * 100)}%～{Math.round(lim.maxFontScale * 100)}%）。</p>
          </div>

          {/* 設定備份：固定 5 組，自己命名、自己選存到哪一組 */}
          <div className="border-t border-slate-100 pt-4">
            <div className="mb-2 flex items-center justify-between gap-2">
              <span className="flex items-center gap-2 text-sm font-bold text-slate-700">
                <UI.IconBadge icon="copy" tone="indigo" round size="h-6 w-6" iconSize={14} />
                設定備份（5 組）
              </span>
              <span className="text-xs text-slate-400">存到哪一組自己選</span>
            </div>

            <div className="space-y-2">
              {slots.map(function (slot, i) {
                return (
                  <div key={i} className="rounded-2xl border border-slate-200 bg-slate-50/70 p-2.5">
                    <div className="flex items-center gap-2">
                      <UI.NumberBadge tone={SLOT_TONES[i % SLOT_TONES.length]} size="h-7 w-7">{i + 1}</UI.NumberBadge>
                      <input className={NAME_INPUT} value={slot.name}
                        placeholder={'第 ' + (i + 1) + ' 組名稱（例：期中考）'}
                        maxLength={lim.slotNameMax || 20}
                        onChange={function (e) { props.onRenameSlot(i, e.target.value); }} />
                    </div>
                    <div className="mt-2 flex flex-wrap items-center gap-1.5">
                      <button type="button" title={'把目前所有設定與資料存到第 ' + (i + 1) + ' 組'}
                        onClick={function () { props.onSaveSlot(i, slot.name); }}
                        className={PILL_BASE + ' ' + PILL.sky}>
                        {Icons.get('download', { size: 14 })}存到這組
                      </button>
                      <button type="button" title={'用第 ' + (i + 1) + ' 組的內容覆蓋目前資料'}
                        disabled={!slot.data}
                        onClick={function () { props.onRestoreSlot(i); }}
                        className={PILL_BASE + ' ' + PILL.emerald}>
                        {Icons.get('upload', { size: 14 })}還原這組
                      </button>
                      <button type="button" title={'清除第 ' + (i + 1) + ' 組備份'}
                        disabled={!slot.data}
                        onClick={function () { props.onClearSlot(i); }}
                        className={PILL_BASE + ' ' + PILL.rose}>
                        {Icons.get('trash', { size: 14 })}清除
                      </button>
                      <span className="ml-auto text-xs font-semibold text-slate-400">{savedLabel(slot.savedAt)}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* 檔案備份（換裝置用）＋ 回復預設值 */}
          <div className="grid grid-cols-2 gap-2 border-t border-slate-100 pt-4">
            <UI.Button icon="download" onClick={props.onExport}>匯出成檔案</UI.Button>
            <UI.Button icon="upload" onClick={function () { fileRef.current && fileRef.current.click(); }}>從檔案匯入</UI.Button>
            <input ref={fileRef} type="file" accept=".json" className="hidden"
              onChange={function (e) {
                var f = e.target.files[0];
                if (f) props.onImportFile(f);
                e.target.value = null;
              }} />
            <UI.Button icon="refresh" variant="danger" full
              onClick={props.onReset}>回復預設值</UI.Button>
          </div>

          <p className="flex items-start gap-2 rounded-lg bg-slate-50 p-2.5 text-xs text-slate-400">
            {Icons.get('sparkles', { size: 15 })}
            <span>
              資料自動保存在此瀏覽器；「回復預設值」固定回到最原始出廠狀態（不會還原成某一組備份），
              5 組備份插槽會保留。換裝置請用「匯出成檔案」。版本 {EC.VERSION}
            </span>
          </p>
        </div>
      </UI.Card>
    );
  };
})();


/* ===================== 27-panel-background.js ===================== */
/**
 * 面板：背景色彩（BackgroundPanel / BackgroundStrip）
 * ------------------------------------------------------------------
 * 背景選項共 10 組（清單定義在 Config.backgrounds）：
 *   8 組「多巴胺漸層」＋ 1 組「原色」＋ 1 組「自訂（可自選三色）」。
 *   - BackgroundPanel：操控台左欄的大卡片面板（10 格色票＋自訂調色）。
 *   - BackgroundStrip：投影畫面左側的直條色票（平時半透明、滑過浮現）。
 * 本模組只負責挑色與回報事件；實際背景由各檢視畫面用
 * EC.UI.gradientStyle(key, customColors) 套用，換色不會動到其他面板。
 * props（Panel）：value, customColors, onChange, onChangeCustom
 * props（Strip）：value, customColors, onChange
 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var UI = EC.UI;
  var Icons = EC.Icons;

  /** 由 key 產生 CSS 漸層字串（custom 會用傳入的自訂三色；找不到時回退第一組） */
  function gradientOf(key, customColors) {
    var p = EC.Config.background(key, customColors);
    return 'linear-gradient(135deg, ' + p.colors.join(', ') + ')';
  }

  /** 讓檢視畫面直接套用的背景樣式物件 */
  EC.UI.gradientStyle = function (key, customColors) {
    return { backgroundImage: gradientOf(key, customColors) };
  };

  /** 操控台：左欄的「背景色彩」卡片 */
  EC.UI.BackgroundPanel = function BackgroundPanel(props) {
    var current = EC.Config.background(props.value, props.customColors);
    var isCustom = props.value === 'custom';
    var colors = EC.Config.normalizeColors(props.customColors);

    function setColor(i, v) {
      var next = colors.slice();
      next[i] = v;
      props.onChangeCustom(next);
    }

    return (
      <UI.Card title="背景色彩" icon="sparkles"
        actions={<span className="text-xs font-semibold text-slate-500">{current.label}</span>}>
        <div className="grid grid-cols-5 gap-2">
          {EC.Config.backgrounds.map(function (bg) {
            var active = bg.key === props.value;
            return (
              <button key={bg.key} type="button" title={bg.label}
                onClick={function () { props.onChange(bg.key); }}
                className={[
                  'group relative h-11 rounded-2xl border-2 shadow-sm transition',
                  'hover:-translate-y-0.5 hover:shadow-md',
                  active ? 'border-slate-700 ring-2 ring-slate-300' : 'border-slate-200'
                ].join(' ')}
                style={{ backgroundImage: gradientOf(bg.key, props.customColors) }}>
                {active ? (
                  <span className="absolute right-1 top-1 flex h-4 w-4 items-center justify-center rounded-full bg-white text-slate-800 shadow">
                    {Icons.get('check', { size: 11 })}
                  </span>
                ) : null}
              </button>
            );
          })}
        </div>

        {isCustom ? (
          <div className="mt-3 rounded-2xl border border-slate-200 bg-slate-50 p-3">
            <div className="mb-2 flex items-center justify-between">
              <span className="text-xs font-bold text-slate-600">自訂三色</span>
              <span className="text-[11px] font-semibold text-slate-400">調整後立即套用</span>
            </div>
            <div className="flex items-center gap-2">
              {colors.map(function (c, i) {
                return (
                  <label key={i}
                    className="flex h-11 flex-1 cursor-pointer items-center gap-2 rounded-xl border border-slate-200 bg-white px-2 shadow-sm">
                    <input type="color" value={c}
                      aria-label={'自訂顏色 ' + (i + 1)}
                      onChange={function (e) { setColor(i, e.target.value); }}
                      className="h-7 w-8 cursor-pointer rounded-md border-0 bg-transparent p-0" />
                    <span className="truncate font-mono text-[11px] font-bold uppercase text-slate-500">{c}</span>
                  </label>
                );
              })}
            </div>
          </div>
        ) : (
          <p className="mt-3 text-xs text-slate-500">
            8 組漸層 ＋ 原色 ＋ 自訂，投影與操控台共用。
          </p>
        )}
      </UI.Card>
    );
  };

  /** 投影畫面：左側直條色票（平時淡出，滑過才明顯） */
  /**
   * 投影畫面的背景色票（兩種變體，依畫面寬度選用）：
   *   variant="rail"（預設）＝左側直條，只在 xl（≥1280px）出現，

   *   variant="bar"＝手機／窄螢幕用的橫向色票列（放在控制列裡，不遮住內容）。
   * props：value, customColors, onChange, variant
   */
  EC.UI.BackgroundStrip = function BackgroundStrip(props) {
    var bar = props.variant === 'bar';

    var chips = EC.Config.backgrounds.map(function (bg) {
      var active = bg.key === props.value;
      return (
        <button key={bg.key} type="button" title={bg.label}
          onClick={function () { props.onChange(bg.key); }}
          className={[
            bar ? 'h-6 w-6 rounded-lg' : 'h-8 w-8 rounded-xl',
            'shrink-0 border-2 transition hover:scale-110',
            active ? 'border-white ring-2 ring-white/70' : 'border-white/40'

          style={{ backgroundImage: gradientOf(bg.key, props.customColors) }} />

  };
})();
