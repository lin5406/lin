/* ===================== 31-view-stage.js ===================== */
/**
 * 檢視：投影畫面（Stage）
 * ------------------------------------------------------------------
 * 設計原則（投影＝遠距離閱讀，清晰度優先）：
 *   1. 版面不重疊：頁首／主區／叮嚀／控制列用 flex 分配高度，
 *      倒數改為「寬度優先的圓角長方框」（UI.ProgressBox），
 *      高度以 aspect-ratio ＋ 32vh 限高，不像圓環那樣佔滿整個畫面，
 *      多出來的縱向空間全部讓給「老師小叮嚀」，也不會擠壓或疊字。
 *      長方框大小由 EC.Hooks.useElementSize 量測，任何視窗比例都安全。
 *      手機（<768px）改成「內容大小」的框：約 66vw、比例 2.3:1 並置中
 *      （框不再是一整條扁長條、框內不留大片空白），小叮嚀則在剩餘空間置中；
 *      背景色票在手機改為底部橫向一排，不會蓋住倒數框。規則都在
 *      index.html 的 .ec-count-box / .ec-announce-card。
 *   2. 字級有下限：文字一律用 clamp()，隨 vmin 縮放的同時保留最小 px，
 *      小視窗也不會出現 8px 的螞蟻字。
 *   3. 高對比：深色遮罩＋四周暗角墊底，所有文字提亮（白／slate-100），
 *      膠囊底色更實、邊框更清楚；倒數用純白＋強陰影（最遠也讀得到）。
 *   4. 彩色圖示輔助：每個區塊都有彩色圖示徽章，遠距離也能快速辨識。
 * fontScale 只用於「老師小叮嚀」文字大小（50%~700%），不影響倒數數字。
 * props：session, info, next, attendance, announcements, clockText,
 *   warning, fontScale, bgSkin, bgCustom, isFullscreen, onToggleFullscreen,
 *   onAdjustFont, onChangeBackground, onExit
 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var UI = EC.UI;
  var Icons = EC.Icons;

  EC.Views = EC.Views || {};

  /** 階段：文字 ＋ 彩色圖示 ＋ 色系 */
  var PHASE = {
    idle:   { text: '準備就緒', icon: 'sparkles', tone: 'indigo' },
    before: { text: '即將開始', icon: 'hourglass', tone: 'amber' },
    live:   { text: '考試進行中', icon: 'play', tone: 'emerald' },
    done:   { text: '時間到', icon: 'flag', tone: 'rose' }
  };

  /** 一般叮嚀的粉彩底色 ＋ 對應彩色圖示（依序循環） */
  var CHIP_STYLES = [
    { tint: 'border-rose-200 bg-rose-50 text-rose-950', icon: 'note', tone: 'rose' },
    { tint: 'border-sky-200 bg-sky-50 text-sky-950', icon: 'sparkles', tone: 'cyan' },
    { tint: 'border-emerald-200 bg-emerald-50 text-emerald-950', icon: 'check', tone: 'emerald' },
    { tint: 'border-amber-200 bg-amber-50 text-amber-950', icon: 'bell', tone: 'amber' },
    { tint: 'border-violet-200 bg-violet-50 text-violet-950', icon: 'pin', tone: 'violet' }
  ];

  /** 投影字級：以 vmin 縮放，但不大於 max、不小於 min（遠近距離都清楚） */
  function fs(vmin, min, max) {
    return 'clamp(' + min + 'px, ' + vmin + 'vmin, ' + max + 'px)';
  }

  function hasAttendance(a) {
    return !!(a && (a.expected || a.present || a.excused || a.excusedSeats));
  }

  EC.Views.StageView = function StageView(props) {
    var p = props;
    var sizePair = EC.Hooks.useElementSize();
    var ringBoxRef = sizePair[0];
    var box = sizePair[1];

    // 倒數長方框：寬度優先（善用橫向空間），高度依 aspect-ratio、上限 32vh
    var boxW = Math.max(280, Math.round(box.width || 900));
    var boxH = Math.max(120, Math.round(box.height || 240));

    var time = EC.TimeEngine.formatDuration(p.info.remainingSec);
    var len = time.length;
    // 字級同時受「框高」與「框寬」限制：框變扁、變窄都不會擠出框外
    var timePx = Math.max(30, Math.round(Math.min(boxH * 0.48, (boxW - 48) / (0.62 * len))));

    var warn = !!(p.warning && p.info.phase === 'live');
    var ringTone = p.info.phase === 'idle' ? 'slate'
      : p.info.phase === 'done' ? 'rose'
      : warn ? 'amber' : 'indigo';
    var thickness = Math.max(8, Math.min(16, Math.round(boxH / 20)));
    var phase = PHASE[p.info.phase] || PHASE.idle;

    var bg = EC.Config.background(p.bgSkin, p.bgCustom).colors;
    var rootStyle = Object.assign(
      { textShadow: '0 2px 22px rgba(2,6,23,0.75)' },
      UI.gradientStyle(p.bgSkin, p.bgCustom)
    );

    // 老師小叮嚀：只顯示啟用中的，聚焦（pinned）優先
    var on = (p.announcements || []).filter(function (a) { return a.enabled; });
    var ordered = on.filter(function (a) { return a.pinned; })
      .concat(on.filter(function (a) { return !a.pinned; }));

    return (
      <div className="relative flex h-screen w-screen flex-col overflow-hidden text-white"
        style={rootStyle}>
        {/* 動態光暈（顏色跟著背景走） */}
        <div className="pointer-events-none absolute inset-0 overflow-hidden">
          <div className="ec-float absolute -left-20 -top-40 h-[42rem] w-[42rem] rounded-full opacity-40 blur-[130px]"
            style={{ backgroundColor: bg[0] }} />
          <div className="ec-float-slow absolute -bottom-48 -right-24 h-[46rem] w-[46rem] rounded-full opacity-35 blur-[130px]"
            style={{ backgroundColor: bg[2] }} />
          <div className="ec-float-slow absolute left-1/3 top-1/4 h-[30rem] w-[30rem] rounded-full opacity-30 blur-[120px]"
            style={{ backgroundColor: bg[1] }} />
        </div>

        {/* 暗色遮罩 + 四周暗角（務必壓在光暈之上，最後才套用） */}
        <div className="pointer-events-none absolute inset-0 bg-slate-950/60" />
        <div className="pointer-events-none absolute inset-0"
          style={{ backgroundImage: 'radial-gradient(122% 104% at 50% 45%, rgba(2,6,23,0.10) 34%, rgba(2,6,23,0.72) 100%)' }} />

        {/* 左側：背景色彩色票 */}
        <UI.BackgroundStrip value={p.bgSkin} customColors={p.bgCustom} onChange={p.onChangeBackground} />

        {/* 頁首 */}
        <header className="relative z-10 flex shrink-0 items-center justify-between gap-4 px-6 py-[1.5vmin] md:px-12">
          <div className="flex min-w-0 items-center gap-[1.3vmin]">
            <UI.IconBadge icon="calendar" tone="indigo" className="text-[3.2vmin]"
              size="h-[7.2vmin] w-[7.2vmin] min-h-9 min-w-9" iconSize="1.5em" />
            <div className="min-w-0">
              <h1 className="truncate font-black tracking-tight text-white"
                style={{ fontSize: fs(3.4, 18, 46) }}>
                {p.session ? p.session.title : '尚未選擇場次'}
              </h1>
              <p className="font-mono font-bold tabular-nums text-slate-200"
                style={{ fontSize: fs(2.1, 13, 26) }}>
                {p.session ? p.session.start + ' – ' + p.session.end : '請先到操控台設定場次'}
              </p>
            </div>
          </div>

          <div className="flex shrink-0 items-center gap-[1.1vmin]">
            <UI.IconBadge icon="clock" tone="cyan" round className="text-[3vmin]"
              size="h-[5.6vmin] w-[5.6vmin] min-h-8 min-w-8" iconSize="1.5em" />
            <div className="text-right">
              <p className="font-black uppercase tracking-[0.3em] text-slate-200"
                style={{ fontSize: fs(1.8, 12, 20) }}>現在時間</p>
              <p className="font-mono font-black leading-none tabular-nums text-white"
                style={{ fontSize: fs(5.4, 24, 68) }}>{p.clockText}</p>
            </div>
          </div>
        </header>

        {/* 主區（內容高度；剩餘高度留給下方的小叮嚀） */}
        <main className="relative z-10 flex shrink-0 flex-col items-center justify-center gap-[1.4vmin] px-6 py-[0.6vmin]">
          {hasAttendance(p.attendance) ? (
            <div className="flex flex-wrap items-center justify-center gap-[0.8vmin]">
              {p.attendance.expected ? (
                <span className={UI.toneClasses('amber', true)} style={{ fontSize: fs(2.1, 13, 26) }}>
                  <UI.IconBadge icon="users" tone="amber" round size="h-[1.6em] w-[1.6em]" iconSize="1em" />
                  應到 {p.attendance.expected}
                </span>
              ) : null}
              {p.attendance.present ? (
                <span className={UI.toneClasses('teal', true)} style={{ fontSize: fs(2.1, 13, 26) }}>
                  <UI.IconBadge icon="badgeCheck" tone="emerald" round size="h-[1.6em] w-[1.6em]" iconSize="1em" />
                  實到 {p.attendance.present}
                </span>
              ) : null}
              {p.attendance.excused ? (
                <span className={UI.toneClasses('rose', true)} style={{ fontSize: fs(2.1, 13, 26) }}>
                  <UI.IconBadge icon="calendar" tone="rose" round size="h-[1.6em] w-[1.6em]" iconSize="1em" />
                  請假 {p.attendance.excused}
                </span>
              ) : null}
              {p.attendance.excusedSeats ? (
                <span className={UI.toneClasses('rose', true)} style={{ fontSize: fs(2.1, 13, 26) }}>
                  <UI.IconBadge icon="hash" tone="violet" round size="h-[1.6em] w-[1.6em]" iconSize="1em" />
                  座號 {p.attendance.excusedSeats}
                </span>
              ) : null}
            </div>
          ) : null}

          {/* 階段膠囊：彩色圖示＋白色文字 */}
          {p.info.phase !== 'idle' ? (
            <div className="flex items-center gap-[0.9vmin] rounded-full border border-white/25 bg-white/10 px-[1.5vmin] py-[0.6vmin] backdrop-blur-md"
              style={{ fontSize: fs(2.2, 14, 28) }}>
              <UI.IconBadge icon={phase.icon} tone={phase.tone} round
                size="h-[2.3em] w-[2.3em]" iconSize="1.35em" />
              <span className="font-black tracking-[0.12em] text-white">{phase.text}</span>
            </div>
          ) : null}

          {/* 倒數圓角長方框：大螢幕＝滿版寬的扁長方框（上限 32vh）；
              手機＝縮到內容大小、置中（尺寸與比例定義在 index.html 的 .ec-count-box） */}
          <UI.ProgressBox boxRef={ringBoxRef}
            className="ec-count-box"
            size={box}
            ratio={p.info.elapsedRatio} tone={ringTone} thickness={thickness}
            trackClass="text-white/20">
            <p className="font-mono font-black leading-none tabular-nums text-white"
              style={{ fontSize: timePx, textShadow: '0 4px 26px rgba(2,6,23,0.92)' }}>
              {time}
            </p>
            <p className="mt-[0.8vmin] flex items-center gap-[0.5em] rounded-full border border-white/20 bg-white/15 py-[0.25em] pl-[0.3em] pr-[1em] font-black text-white"
              style={{ fontSize: fs(2, 13, 26) }}>
              <UI.IconBadge icon="target" tone="indigo" round size="h-[1.7em] w-[1.7em]" iconSize="1.05em" />
              進度 {Math.round((p.info.elapsedRatio || 0) * 100)}%
            </p>
          </UI.ProgressBox>

          {/* 下一場 */}
          {p.next ? (
            <p className="flex flex-wrap items-center justify-center gap-[0.7vmin] font-bold text-slate-100"
              style={{ fontSize: fs(2.1, 13, 27) }}>
              <span className="flex items-center gap-[0.45em] font-black text-amber-200">
                <UI.IconBadge icon="arrowRight" tone="cyan" round size="h-[1.6em] w-[1.6em]" iconSize="1em" />
                下一場
              </span>
              <span className="font-black text-white">{p.next.title}</span>
              <span className="font-mono tabular-nums text-slate-200">
                {p.next.start}–{p.next.end}
              </span>
            </p>
          ) : null}
        </main>

        {/* 老師小叮嚀（字級 50%~700%；只有「聚焦」的再加放大與金色）
            佔用主區以外的剩餘高度 → 長方框省下的空間都在這裡 */}
        {ordered.length > 0 ? (
          <section className="relative z-10 flex min-h-0 flex-1 flex-col overflow-y-auto px-6 pb-[1.4vmin] md:px-12">
            <div className="ec-announce-card w-full rounded-3xl border border-white/20 bg-white/10 p-[1.5vmin] backdrop-blur-md">
              <p className="mb-[1.1vmin] flex items-center gap-[0.7vmin] font-black text-white"
                style={{ fontSize: fs(2.3, 15, 30) }}>
                <UI.IconBadge icon="megaphone" tone="rose"
                  size="h-[1.9em] w-[1.9em]" iconSize="1.25em" />
                老師小叮嚀
              </p>
              <div className="flex flex-wrap items-center gap-[0.9vmin]">
                {ordered.map(function (a, i) {
                  var s = CHIP_STYLES[i % CHIP_STYLES.length];
                  if (a.pinned) {
                    return (
                      <span key={a.id}
                        className="inline-flex items-center gap-[0.6em] rounded-2xl border-2 border-amber-200 bg-gradient-to-r from-amber-300 to-orange-400 px-[1em] py-[0.5em] font-black leading-snug text-amber-950 shadow-lg"
                        style={{ fontSize: 'calc(' + fs(2.4, 14, 34) + ' * ' + (p.fontScale * 1.25) + ')' }}>
                        {Icons.get('star', { size: '1.2em' })}
                        <span>{a.text}</span>
                      </span>
                    );
                  }
                  return (
                    <span key={a.id}
                      className={'inline-flex items-center gap-[0.55em] rounded-2xl border-2 px-[1em] py-[0.5em] font-black leading-snug shadow-md ' + s.tint}
                      style={{ fontSize: 'calc(' + fs(2.4, 14, 34) + ' * ' + p.fontScale + ')' }}>
                      <UI.IconBadge icon={s.icon} tone={s.tone} round
                        size="h-[1.5em] w-[1.5em]" iconSize="1em" />
                      <span>{a.text}</span>
                    </span>
                  );
                })}
              </div>
            </div>
          </section>
        ) : null}

        {/* 控制列：手機置中換行、大螢幕靠右；色票在手機改成橫向一排，不遮住倒數框 */}
        <footer className="relative z-10 flex shrink-0 flex-wrap items-center justify-center gap-[0.9vmin] px-6 pb-[1.4vmin] md:justify-end md:px-12">
          <div className="flex w-full justify-center xl:hidden">
            <UI.BackgroundStrip variant="bar" value={p.bgSkin} customColors={p.bgCustom}
              onChange={p.onChangeBackground} />
          </div>

          <div className="flex items-center gap-1 rounded-full border border-white/25 bg-white/10 p-1 backdrop-blur-md"
            style={{ fontSize: fs(1.9, 12, 21) }}>
            <span className="flex items-center gap-[0.45em] pl-[0.5em] pr-1 font-black text-white">
              <UI.IconBadge icon="note" tone="violet" round size="h-[1.7em] w-[1.7em]" iconSize="1.05em" />
              <span className="hidden sm:inline">叮嚀字級</span>
            </span>
            <button type="button" onClick={function () { p.onAdjustFont(-1); }}
              title="縮小叮嚀字級"
              className="flex h-[2.4em] w-[2.4em] items-center justify-center rounded-full bg-white/10 text-white transition hover:bg-white/25">
              {Icons.get('minus', { size: '1.2em' })}
            </button>
            <span className="min-w-[3.2em] text-center font-black tabular-nums text-white">
              {Math.round(p.fontScale * 100)}%
            </span>
            <button type="button" onClick={function () { p.onAdjustFont(1); }}
              title="放大叮嚀字級"
              className="flex h-[2.4em] w-[2.4em] items-center justify-center rounded-full bg-white/10 text-white transition hover:bg-white/25">
              {Icons.get('plus', { size: '1.2em' })}
            </button>
          </div>

          <button type="button" onClick={p.onToggleFullscreen}
            className="inline-flex items-center gap-[0.5em] rounded-full border border-white/25 bg-white/10 py-[0.45em] pl-[0.45em] pr-[1.1em] font-black text-white backdrop-blur-md transition hover:bg-white/20"
            style={{ fontSize: fs(1.9, 12, 21) }}>
            <UI.IconBadge icon={p.isFullscreen ? 'shrink' : 'expand'} tone="sky" round size="h-[1.7em] w-[1.7em]" iconSize="1.05em" />
            {p.isFullscreen ? '縮小' : '全螢幕'}
          </button>

          <button type="button" onClick={p.onExit}
            className="inline-flex items-center gap-[0.5em] rounded-full bg-gradient-to-r from-indigo-500 to-violet-500 py-[0.45em] pl-[0.45em] pr-[1.1em] font-black text-white shadow-lg shadow-indigo-900/40 transition hover:brightness-110"
            style={{ fontSize: fs(1.9, 12, 21) }}>
            <span className="flex h-[1.7em] w-[1.7em] items-center justify-center rounded-full bg-white/25 text-white">
              {Icons.get('settings', { size: '1.05em' })}
            </span>
            回操控台
          </button>
        </footer>
      </div>
    );
  };
})();


/* ===================== 40-app.js ===================== */
/**
 * 應用：狀態中樞（App）
 * ------------------------------------------------------------------
 * 唯一持有狀態的地方：載入/儲存、計時、階段轉換（響鈴、自動投影、
 * 自動換場）、匯入匯出，並把資料與事件派給兩個檢視畫面。
 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var UI = EC.UI;
  var Views = EC.Views;
  var Time = EC.TimeEngine;
  var Audio = EC.AudioEngine;
  var A = EC.Store.actions;

  var useReducer = React.useReducer;
  var useState = React.useState;
  var useEffect = React.useEffect;
  var useRef = React.useRef;

  EC.App = function App() {
    var statePair = useReducer(EC.Store.reducer, undefined, EC.Storage.load);
    var state = statePair[0];
    var dispatch = statePair[1];

    var viewPair = useState('console'); // console | stage
    var view = viewPair[0];
    var setView = viewPair[1];

    var dialogPair = useState(null);
    var dialog = dialogPair[0];
    var setDialog = dialogPair[1];

    var now = EC.Hooks.useTicker(1000);
    var stageRef = useRef(null);
    var prevPhase = useRef('idle');
    var warned = useRef(false);
    var lastSessionId = useRef(null);
    // 只有「場次自然結束」（進行中 → 已結束）才允許自動換場，
    // 手動點選已結束的場次不會被自動跳走。
    var autoAdvance = useRef(false);

    var fullscreenPair = EC.Hooks.useFullscreen(stageRef);
    var isFullscreen = fullscreenPair[0];
    var toggleFullscreen = fullscreenPair[1];

    var wakePair = EC.Hooks.useWakeLock();
    var wakeActive = wakePair[0];
    var requestWake = wakePair[1];
    var releaseWake = wakePair[2];

    // 自動儲存（延遲寫入，避免每秒寫入）
    EC.Hooks.useDebouncedEffect(function () {
      EC.Storage.save(state);
    }, [state], 250);

    var session = state.sessions.filter(function (s) { return s.id === state.activeSessionId; })[0] || null;
    var info = Time.compute(session, now);
    var next = Time.nextSession(state.sessions, state.activeSessionId);
    var warning = Time.isWarningPhase(info, state.settings.warnMinutes);

    var clockText = now.toLocaleTimeString('zh-TW', {
      hour12: !state.settings.clock24,
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });

    // --- 階段轉換：響鈴 / 自動投影 / 最後警示 / 自動換場 ---
    useEffect(function () {
      if (session && lastSessionId.current !== session.id) {
        lastSessionId.current = session.id;
        prevPhase.current = info.phase;
        warned.current = false;
        autoAdvance.current = false;
      }
      if (!session) return;

      var prev = prevPhase.current;
      if (prev !== info.phase) {
        if (info.phase === 'live' && (prev === 'before' || prev === 'idle')) {
          if (state.settings.bellAtStart) Audio.play(state.settings.tone, state.settings.volume);
          if (state.settings.autoStage) setView('stage');
          warned.current = false;
        }
        if (info.phase === 'done' && prev === 'live') {
          if (state.settings.bellAtEnd) Audio.play(state.settings.tone, state.settings.volume, true);
          autoAdvance.current = true; // 自然結束，才允許自動換下一場
        }
        prevPhase.current = info.phase;
      }

      if (info.phase === 'live' && state.settings.warnMinutes > 0 &&
          !warned.current && info.remainingSec <= state.settings.warnMinutes * 60) {
        warned.current = true;
        Audio.warn(state.settings.volume);
      }

      if (autoAdvance.current && state.settings.autoAdvanceNext &&
          info.phase === 'done' && next && info.overrunSec >= state.settings.advanceDelaySec) {
        dispatch(A.selectSession(next.id));
      }
    }, [info.phase, info.remainingSec, info.overrunSec, session && session.id,
        next && next.id, state.settings]);

    // --- 投影時避免螢幕休眠 ---
    useEffect(function () {
      if (view === 'stage') requestWake(); else releaseWake();
      return function () { releaseWake(); };
    }, [view]);

    // --- Esc 離開投影 ---
    useEffect(function () {
      function onKey(e) { if (e.key === 'Escape' && view === 'stage') setView('console'); }
      window.addEventListener('keydown', onKey);
      return function () { window.removeEventListener('keydown', onKey); };
    }, [view]);

    // --- 匯出 / 匯入 / 備份插槽 / 重設 ---
    /** 目前資料快照（不含 5 組插槽本身），存檔與匯出共用 */
    function currentSnapshot() {
      return EC.Storage.snapshot(state);
    }

    function exportData() {
      var payload = currentSnapshot();
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'examclock-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    /** 把目前資料存到第 index 組備份（名稱＝輸入框內容） */
    function saveSlot(index, name) {
      var clean = (name || '').trim();
      var label = clean || ('第 ' + (index + 1) + ' 組');
      dispatch(A.saveSlot(index, clean, currentSnapshot()));
      setDialog({
        title: '已存到第 ' + (index + 1) + ' 組',
        message: '「' + label + '」：目前的場次、公告、即時紀錄與設定都備份好了。',
        confirmLabel: '好', hideCancel: true, onConfirm: closeDialog
      });
    }

    function renameSlot(index, name) {
      dispatch(A.updateSlot(index, { name: name.slice(0, EC.Config.limits.slotNameMax || 20) }));
    }

    function clearSlot(index) {
      var slot = (state.settings.slots || [])[index] || {};
      setDialog({
        title: '清除第 ' + (index + 1) + ' 組備份',
        message: '「' + (slot.name || ('第 ' + (index + 1) + ' 組')) + '」的備份內容會被刪除，目前資料不受影響。',
        confirmLabel: '清除', tone: 'danger',
        onConfirm: function () { dispatch(A.clearSlot(index)); closeDialog(); }
      });
    }

    function restoreSlot(index) {
      var slot = (state.settings.slots || [])[index] || {};
      if (!slot.data) return;
      setDialog({
        title: '從第 ' + (index + 1) + ' 組還原',
        message: '「' + (slot.name || ('第 ' + (index + 1) + ' 組')) + '」的內容會覆蓋目前所有資料（其他備份組不受影響）。',
        confirmLabel: '還原', tone: 'warn',
        onConfirm: function () {
          // 還原時保留目前 5 組插槽，避免把其他備份一起蓋掉
          dispatch(A.replaceAll(EC.Storage.buildState(slot.data, state.settings.slots)));
          closeDialog();
        }
      });
    }

    function importFile(file) {
      var reader = new FileReader();
      reader.onload = function (e) {
        try {
          var raw = JSON.parse(e.target.result);
          // 匯入檔案同樣保留目前 5 組插槽
          dispatch(A.replaceAll(EC.Storage.buildState(raw, state.settings.slots)));
          setDialog({ title: '匯入完成', message: '設定已成功載入。', confirmLabel: '好', hideCancel: true, onConfirm: closeDialog });
        } catch (err) {
          setDialog({ title: '匯入失敗', message: '檔案格式無法辨識，請使用本程式匯出的備份檔。', confirmLabel: '好', hideCancel: true, tone: 'danger', onConfirm: closeDialog });
        }
      };
      reader.readAsText(file);
    }

    function closeDialog() { setDialog(null); }

    function confirmReset() {
      setDialog({
        title: '回復預設值',
        message: '所有場次、公告與紀錄會回到最原始出廠狀態（不是還原成某一組備份）。5 組備份插槽會保留，確定要繼續嗎？',
        tone: 'danger', confirmLabel: '回到出廠狀態', onConfirm: function () { dispatch(A.reset()); closeDialog(); }
      });
    }

    function confirmDeleteSession(s) {
      setDialog({
        title: '刪除場次', message: '確定刪除「' + s.title + '」？此動作無法復原。',
        tone: 'danger', confirmLabel: '刪除',
        onConfirm: function () { dispatch(A.deleteSession(s.id)); closeDialog(); }
      });
    }

    function confirmClearNotes() {
      setDialog({
        title: '清空紀錄', message: '確定清空全部即時紀錄？',
        tone: 'danger', confirmLabel: '清空',
        onConfirm: function () { dispatch(A.clearNotes()); closeDialog(); }
      });
    }

    function stepSession(delta) {
      var i = state.sessions.findIndex(function (s) { return s.id === state.activeSessionId; });
      var j = i + delta;
      if (i !== -1 && j >= 0 && j < state.sessions.length) dispatch(A.selectSession(state.sessions[j].id));
    }

    var dialogNode = dialog ? (
      <UI.ConfirmDialog
        open={true}
        title={dialog.title}
        message={dialog.message}
        tone={dialog.tone}
        confirmLabel={dialog.confirmLabel}
        hideCancel={dialog.hideCancel}
        onConfirm={dialog.onConfirm}
        onCancel={closeDialog}
      />
    ) : null;

    if (view === 'stage') {
      return (
        <React.Fragment>
          <div ref={stageRef}>
            <Views.StageView
              session={session}
              info={info}
              next={next}
              attendance={state.attendance}
              announcements={state.announcements}
              clockText={clockText}
              warning={warning}
              fontScale={state.settings.fontScale}
              bgSkin={state.settings.bgSkin}
              bgCustom={state.settings.bgCustom}
              isFullscreen={isFullscreen}
              onToggleFullscreen={toggleFullscreen}
              onAdjustFont={function (d) {
                var lim = EC.Config.limits;
                var v = Math.round((state.settings.fontScale + d) * 100) / 100;
                dispatch(A.updateSettings({ fontScale: Math.min(lim.maxFontScale, Math.max(lim.minFontScale, v)) }));
              }}
              onChangeBackground={function (k) { dispatch(A.updateSettings({ bgSkin: k })); }}
              onChangeCustomBackground={function (colors) { dispatch(A.updateSettings({ bgCustom: EC.Config.normalizeColors(colors) })); }}
              onExit={function () { setView('console'); }}
            />
          </div>
          {dialogNode}
        </React.Fragment>
      );
    }

    return (
      <React.Fragment>
        <Views.ConsoleView
          currentTime={now}
          clockText={clockText}
          session={session}
          info={info}
          next={next}
          warning={warning}
          sessions={state.sessions}
          activeId={state.activeSessionId}
          attendance={state.attendance}
          announcements={state.announcements}
          notes={state.notes}
          settings={state.settings}
          bgSkin={state.settings.bgSkin}
          bgCustom={state.settings.bgCustom}
          onSelect={function (id) { dispatch(A.selectSession(id)); }}
          onAddSession={function (s) { dispatch(A.addSession(s)); }}
          onUpdateSession={function (s) { dispatch(A.updateSession(s)); }}
          onDeleteSession={confirmDeleteSession}
          onMoveSession={function (id, d) { dispatch(A.moveSession(id, d)); }}
          onDuplicateSession={function (id) { dispatch(A.duplicateSession(id)); }}
          onApplyPreset={function (list) { dispatch(A.applyPreset(list)); }}
          onPrevSession={function () { stepSession(-1); }}
          onNextSession={function () { stepSession(1); }}
          onOpenStage={function () { Audio.unlock(); setView('stage'); }}
          onAttendanceChange={function (k, v) { dispatch(A.setAttendance(k, v)); }}
          onAddAnnouncement={function (t) { dispatch(A.addAnnouncement(t)); }}
          onUpdateAnnouncement={function (id, patch) { dispatch(A.updateAnnouncement(id, patch)); }}
          onDeleteAnnouncement={function (id) { dispatch(A.deleteAnnouncement(id)); }}
          onAddNote={function (t) { dispatch(A.addNote(t)); }}
          onDeleteNote={function (id) { dispatch(A.deleteNote(id)); }}
          onClearNotes={confirmClearNotes}
          onUpdateSettings={function (patch) { dispatch(A.updateSettings(patch)); }}
          onChangeBackground={function (k) { dispatch(A.updateSettings({ bgSkin: k })); }}
          onChangeCustomBackground={function (list) { dispatch(A.updateSettings({ bgCustom: list })); }}
          onTestTone={function (tone, volume) { Audio.play(tone, volume); }}
          onExport={exportData}
          onImportFile={importFile}
          onSaveSlot={saveSlot}
          onRenameSlot={renameSlot}
          onRestoreSlot={restoreSlot}
          onClearSlot={clearSlot}
          onRequestReset={confirmReset}
        />
        {dialogNode}
      </React.Fragment>
    );
  };
})();

/**
 * 應用：入口（main）
 * ------------------------------------------------------------------
 * 將 App 掛載到 #root。
 */
(function () {
  'use strict';
  var EC = window.ExamClock;
  var root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<EC.App />);
})();

</script>
